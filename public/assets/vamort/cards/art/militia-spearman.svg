<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 220" width="290" height="220">
  <defs>
    <linearGradient id="humanUnitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5e6c8"/>
      <stop offset="50%" style="stop-color:#e8d5b7"/>
      <stop offset="100%" style="stop-color:#d4c4a8"/>
    </linearGradient>
    <linearGradient id="leatherArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b6b3a"/>
      <stop offset="50%" style="stop-color:#6b4b2a"/>
      <stop offset="100%" style="stop-color:#4a301a"/>
    </linearGradient>
    <linearGradient id="steelWeapon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f0f0"/>
      <stop offset="50%" style="stop-color:#c0c0c0"/>
      <stop offset="100%" style="stop-color:#909090"/>
    </linearGradient>
    <linearGradient id="holyAura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fffacd"/>
      <stop offset="100%" style="stop-color:#daa520"/>
    </linearGradient>
  </defs>
  
  <rect width="290" height="220" fill="url(#humanUnitBg)"/>
  
  <!-- Village/church background -->
  <g opacity="0.3">
    <path d="M 0,220 L 0,140 Q 0,120 20,120 L 80,120 Q 80,100 100,100 L 190,100 Q 190,120 210,120 L 290,120 L 290,220 Z" fill="#c4b4a8"/>
    <path d="M 100,100 L 100,50 Q 100,30 120,30 L 170,30 Q 190,30 190,50 L 190,100 Z" fill="#c4b4a8"/>
    <path d="M 120,30 L 120,10 Q 120,0 145,0 Q 170,0 170,10 L 170,30 Z" fill="#8b7b4a"/>
    <!-- Cross on roof -->
    <path d="M 140,10 L 140,-10 M 135,-5 L 145,-5" stroke="#daa520" stroke-width="2" opacity="0.5"/>
  </g>
  
  <!-- Townsfolk militia -->
  <g transform="translate(145, 150)">
    <!-- Cloak/Tabard -->
    <path d="M -45,5 Q -55,-5 -50,-30 Q -30,-45 0,-40 Q 30,-45 50,-30 Q 55,-5 45,5 Q 25,15 0,10 Q -25,15 -45,5" 
          fill="url(#leatherArmor)" stroke="#5a3a1a" stroke-width="1.5"/>
    <!-- Cross on tabard -->
    <rect x="-4" y="-15" width="8" height="25" fill="url(#holyAura)"/>
    <rect x="-12" y="-5" width="24" height="8" fill="url(#holyAura)"/>
    
    <!-- Leather armor body -->
    <ellipse cx="0" cy="20" rx="28" ry="30" fill="url(#leatherArmor)" stroke="#5a3a1a" stroke-width="1"/>
    <!-- Belt -->
    <rect x="-28" y="35" width="56" height="6" fill="#3a200a"/>
    <rect x="-4" y="33" width="8" height="10" fill="url(#holyAura)"/>
    <!-- Pouches -->
    <ellipse cx="-20" cy="40" rx="8" ry="6" fill="#4a301a" stroke="#3a200a" stroke-width="1"/>
    <ellipse cx="20" cy="40" rx="8" ry="6" fill="#4a301a" stroke="#3a200a" stroke-width="1"/>
    
    <!-- Spear -->
    <g transform="translate(-50, -10) rotate(-20)">
      <rect x="-2" y="-100" width="4" height="110" fill="url(#steelWeapon)"/>
      <!-- Spearhead -->
      <path d="M -8,-100 L 0,-120 L 8,-100 Z" fill="url(#steelWeapon)" stroke="#fff" stroke-width="1"/>
      <line x1="0" y1="-120" x2="0" y2="-95" stroke="#fff" stroke-width="1" opacity="0.5"/>
      <!-- Banner on spear -->
      <path d="M 6,-100 L 30,-100 L 30,-80 L 6,-80 Z" fill="url(#holyAura)" stroke="#daa520" stroke-width="1"/>
      <path d="M 10,-95 L 18,-95 M 10,-90 L 18,-90 M 10,-85 L 18,-85" stroke="#8b7b4a" stroke-width="1"/>
    </g>
    
    <!-- Shield on back -->
    <g transform="translate(40, 15)">
      <path d="M 0,-25 L 18,-15 L 18,15 Q 18,25 0,30 Q -18,25 -18,15 L -18,-15 Z" 
            fill="url(#leatherArmor)" stroke="url(#holyAura)" stroke-width="2"/>
      <rect x="-3" y="-20" width="6" height="35" fill="url(#holyAura)" opacity="0.7"/>
      <rect x="-10" y="0" width="20" height="6" fill="url(#holyAura)" opacity="0.7"/>
    </g>
    
    <!-- Head with simple helm -->
    <ellipse cx="0" cy="-30" rx="18" ry="20" fill="#e8d5b7" stroke="#c4b4a8" stroke-width="1"/>
    <!-- Helmet brim -->
    <path d="M -18,-40 Q -20,-45 -10,-45 Q 0,-50 10,-45 Q 20,-45 18,-40" fill="#6b4b2a" stroke="#5a3a1a" stroke-width="1"/>
    <!-- Face -->
    <ellipse cx="-5" cy="-32" rx="2.5" ry="3" fill="#3a200a"/>
    <ellipse cx="5" cy="-32" rx="2.5" ry="3" fill="#3a200a"/>
    <path d="M -5,-22 Q 0,-20 5,-22" stroke="#3a200a" stroke-width="1.5" fill="none"/>
    <!-- Hair -->
    <path d="M -15,-38 Q -18,-42 -12,-45 Q -8,-42 -5,-38" fill="#4a301a"/>
    <path d="M 15,-38 Q 18,-42 12,-45 Q 8,-42 5,-38" fill="#4a301a"/>
    
    <!-- Determined expression lines -->
    <path d="M -8,-36 L -8,-34 M 8,-36 L 8,-34" stroke="#3a200a" stroke-width="1"/>
  </g>
  
  <!-- Fellow militia in background -->
  <g transform="translate(220, 160) scale(0.6)" opacity="0.5">
    <path d="M -45,5 Q -55,-5 -50,-30 Q -30,-45 0,-40 Q 30,-45 50,-30 Q 55,-5 45,5 Q 25,15 0,10 Q -25,15 -45,5" 
          fill="url(#leatherArmor)" stroke="#5a3a1a" stroke-width="1"/>
    <rect x="-4" y="-15" width="8" height="25" fill="url(#holyAura)"/>
    <rect x="-12" y="-5" width="24" height="8" fill="url(#holyAura)"/>
    <ellipse cx="0" cy="20" rx="28" ry="30" fill="url(#leatherArmor)"/>
    <g transform="translate(-40, -10) rotate(-20)">
      <rect x="-1.5" y="-60" width="3" height="70" fill="url(#steelWeapon)"/>
      <path d="M -5,-60 L 0,-72 L 5,-60 Z" fill="url(#steelWeapon)"/>
    </g>
    <ellipse cx="0" cy="-30" rx="18" ry="20" fill="#e8d5b7"/>
    <path d="M -18,-40 Q -20,-45 -10,-45 Q 0,-50 10,-45 Q 20,-45 18,-40" fill="#6b4b2a"/>
  </g>
  
  <g transform="translate(70, 165) scale(0.55)" opacity="0.4">
    <path d="M -45,5 Q -55,-5 -50,-30 Q -30,-45 0,-40 Q 30,-45 50,-30 Q 55,-5 45,5 Q 25,15 0,10 Q -25,15 -45,5" 
          fill="url(#leatherArmor)" stroke="#5a3a1a" stroke-width="1"/>
    <rect x="-4" y="-15" width="8" height="25" fill="url(#holyAura)"/>
    <ellipse cx="0" cy="20" rx="28" ry="30" fill="url(#leatherArmor)"/>
    <g transform="translate(-40, -10) rotate(-20)">
      <rect x="-1.5" y="-60" width="3" height="70" fill="url(#steelWeapon)"/>
      <path d="M -5,-60 L 0,-72 L 5,-60 Z" fill="url(#steelWeapon)"/>
    </g>
    <ellipse cx="0" cy="-30" rx="18" ry="20" fill="#e8d5b7"/>
    <path d="M -18,-40 Q -20,-45 -10,-45 Q 0,-50 10,-45 Q 20,-45 18,-40" fill="#6b4b2a"/>
  </g>
  
  <!-- Divine light shafts -->
  <g stroke="url(#holyAura)" stroke-width="1" opacity="0.2">
    <line x1="60" y1="0" x2="80" y2="220"/>
    <line x1="130" y1="0" x2="120" y2="220"/>
    <line x1="200" y1="0" x2="210" y2="220"/>
    <line x1="260" y1="0" x2="250" y2="220"/>
  </g>
  
  <rect x="2" y="2" width="286" height="216" fill="none" stroke="url(#holyAura)" stroke-width="2" opacity="0.5" rx="4"/>
</svg>