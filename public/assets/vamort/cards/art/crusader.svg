<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 220" width="290" height="220">
  <defs>
    <linearGradient id="crusaderBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f0f0"/>
      <stop offset="50%" style="stop-color:#e0e0e0"/>
      <stop offset="100%" style="stop-color:#d0d0d0"/>
    </linearGradient>
    <linearGradient id="whiteGoldArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff"/>
      <stop offset="30%" style="stop-color:#f5f5f5"/>
      <stop offset="60%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#ddd"/>
    </linearGradient>
    <linearGradient id="goldTrim3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#daa520"/>
    </linearGradient>
    <linearGradient id="divineShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff"/>
      <stop offset="50%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#fff"/>
    </linearGradient>
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#ffd700;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:0"/>
    </radialGradient>
    <filter id="divineAura">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#ffd700" flood-opacity="0.5"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="290" height="220" fill="url(#crusaderBg)"/>

  <!-- Divine light from above -->
  <g transform="translate(145, 50)">
    <circle cx="0" cy="0" r="120" fill="url(#auraGlow)" opacity="0.2">
      <animate attributeName="r" values="120;140;120" dur="4s" repeatCount="indefinite"/>
    </circle>
    <g stroke="url(#goldTrim3)" stroke-width="1.5" opacity="0.3">
      <line x1="0" y1="-140" x2="0" y2="-80">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="30s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="80" x2="0" y2="140">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="30s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>

  <!-- Crusader figure -->
  <g transform="translate(145, 155)">
    <!-- Full plate armor -->
    <path d="M -45,0 Q -55,-30 -45,-90 Q -25,-125 0,-135 Q 25,-125 45,-90 Q 55,-30 45,0 Q 35,20 0,25 Q -35,20 -45,0" fill="url(#whiteGoldArmor)" stroke="url(#goldTrim3)" stroke-width="2"/>

    <!-- Large pauldrons -->
    <ellipse cx="-48" cy="-15" rx="24" ry="18" fill="url(#whiteGoldArmor)" stroke="url(#goldTrim3)" stroke-width="2.5"/>
    <ellipse cx="48" cy="-15" rx="24" ry="18" fill="url(#whiteGoldArmor)" stroke="url(#goldTrim3)" stroke-width="2.5"/>
    <!-- Cross on pauldrons -->
    <g transform="translate(-48, -15)" filter="url(#divineAura)">
      <path d="M 0,-15 L 0,3 M -9,-6 L 9,-6" stroke="url(#goldTrim3)" stroke-width="3"/>
    </g>
    <g transform="translate(48, -15)" filter="url(#divineAura)">
      <path d="M 0,-15 L 0,3 M -9,-6 L 9,-6" stroke="url(#goldTrim3)" stroke-width="3"/>
    </g>

    <!-- Breastplate with large cross -->
    <path d="M -30,-15 Q -35,-50 -15,-75 Q 0,-80 15,-75 Q 35,-50 30,-15 Q 25,15 -5,25 Q -25,15 -30,-15" fill="url(#whiteGoldArmor)" stroke="url(#goldTrim3)" stroke-width="2"/>
    <path d="M 0,-55 L 0,-25 M -15,-40 L 15,-40" stroke="url(#goldTrim3)" stroke-width="4" filter="url(#divineAura)"/>

    <!-- Divine Shield floating at chest -->
    <g transform="translate(0, -40)" filter="url(#divineAura)">
      <ellipse cx="0" cy="0" rx="22" ry="18" fill="url(#divineShieldGrad)" stroke="url(#goldTrim3)" stroke-width="2" opacity="0.7">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="rx" values="22;20;22" dur="2s" repeatCount="indefinite"/>
      </ellipse>
      <path d="M 0,-12 L 0,4 M -10,-4 L 10,-4" stroke="url(#goldTrim3)" stroke-width="2.5" opacity="0.9"/>
    </g>

    <!-- Arms in heavy gauntlets -->
    <!-- Left arm with shield -->
    <g transform="translate(-55, 10)">
      <rect x="-12" y="-15" width="24" height="55" rx="4" fill="url(#whiteGoldArmor)" stroke="url(#goldTrim3)" stroke-width="2"/>
      <rect x="-14" y="40" width="28" height="20" rx="4" fill="url(#whiteGoldArmor)" stroke="url(#goldTrim3)" stroke-width="2"/>
      <!-- Tower shield -->
      <g transform="translate(-20, -30)">
        <path d="M -35,0 Q -45,-30 -25,-70 Q 0,-85 25,-70 Q 45,-30 35,0 Q 30,20 0,25 Q -30,20 -35,0" fill="url(#whiteGoldArmor)" stroke="url(#goldTrim3)" stroke-width="3" filter="url(#divineAura)"/>
        <path d="M 0,-65 L 0,-15 M -20,-40 L 20,-40" stroke="url(#goldTrim3)" stroke-width="3" filter="url(#divineAura)"/>
        <circle cx="0" cy="-40" r="20" fill="none" stroke="url(#goldTrim3)" stroke-width="1.5" opacity="0.5"/>
      </g>
    </g>

    <!-- Right arm with sword -->
    <g transform="translate(55, 10)">
      <rect x="-12" y="-15" width="24" height="55" rx="4" fill="url(#whiteGoldArmor)" stroke="url(#goldTrim3)" stroke-width="2"/>
      <rect x="-14" y="40" width="28" height="20" rx="4" fill="url(#whiteGoldArmor)" stroke="url(#goldTrim3)" stroke-width="2"/>
      <!-- Longsword -->
      <g transform="translate(0, 60) rotate(-5)">
        <rect x="-4" y="-100" width="8" height="120" fill="url(#whiteGoldArmor)" stroke="url(#goldTrim3)" stroke-width="1.5"/>
        <path d="M -15,-100 L 0,-120 L 15,-100 Z" fill="url(#whiteGoldArmor)" stroke="url(#goldTrim3)" stroke-width="1.5" filter="url(#divineAura)"/>
        <line x1="0" y1="-120" x2="0" y2="-20" stroke="#fff" stroke-width="1.5" filter="url(#divineAura)" opacity="0.8"/>
        <rect x="-18" y="-105" width="36" height="10" fill="url(#goldTrim3)" stroke="#daa520" stroke-width="1"/>
        <rect x="-12" y="-102" width="24" height="4" fill="#ffd700"/>
      </g>
    </g>

    <!-- Helm with plume -->
    <path d="M -30,-55 Q -30,-85 0,-95 Q 30,-85 30,-55 Q 30,-50 24,-50 Q 15,-65 0,-65 Q -15,-65 -24,-50 Q -30,-50 -30,-55" fill="url(#whiteGoldArmor)" stroke="url(#goldTrim3)" stroke-width="2.5"/>
    <!-- Visor -->
    <rect x="-18" y="-72" width="36" height="8" fill="#1a1a1a" stroke="url(#goldTrim3)" stroke-width="1"/>
    <line x1="0" y1="-72" x2="0" y2="-64" stroke="url(#goldTrim3)" stroke-width="2" filter="url(#divineAura)"/>
    <!-- Plume -->
    <path d="M -5,-95 Q -10,-110 0,-120 Q 10,-110 5,-95" fill="url(#goldTrim3)" stroke="#daa520" stroke-width="1" filter="url(#divineAura)">
      <animate attributeName="d" values="M -5,-95 Q -10,-110 0,-120 Q 10,-110 5,-95; M -5,-95 Q -12,-115 0,-125 Q 12,-115 5,-95; M -5,-95 Q -10,-110 0,-120 Q 10,-110 5,-95" dur="2s" repeatCount="indefinite"/>
    </path>

    <!-- Tassets and greaves -->
    <path d="M -40,40 Q -45,60 -20,80 Q 0,85 20,80 Q 45,60 40,40 Q 35,55 -5,65 Q -35,55 -40,40" fill="url(#whiteGoldArmor)" stroke="url(#goldTrim3)" stroke-width="1.5"/>
    <!-- Greaves -->
    <g transform="translate(-25, 75)">
      <rect x="-12" y="0" width="24" height="50" rx="3" fill="url(#whiteGoldArmor)" stroke="url(#goldTrim3)" stroke-width="1.5"/>
    </g>
    <g transform="translate(25, 75)">
      <rect x="-12" y="0" width="24" height="50" rx="3" fill="url(#whiteGoldArmor)" stroke="url(#goldTrim3)" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Holy light on ground -->
  <ellipse cx="145" cy="205" rx="70" ry="12" fill="url(#auraGlow)" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.6;0.4" dur="2s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Floating holy motes -->
  <g fill="url(#goldTrim3)">
    <circle cx="30" cy="40" r="2">
      <animate attributeName="cy" values="40;20;40" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="50" r="1.5">
      <animate attributeName="cy" values="50;25;50" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="180" r="2">
      <animate attributeName="cy" values="180;160;180" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="190" r="1.5">
      <animate attributeName="cy" values="190;170;190" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="2" y="2" width="286" height="216" fill="none" stroke="url(#goldTrim3)" stroke-width="2" opacity="0.7" rx="4"/>
</svg>