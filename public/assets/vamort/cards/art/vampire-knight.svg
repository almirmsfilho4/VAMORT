<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 220" width="290" height="220">
  <defs>
    <linearGradient id="vampireKnightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0000"/>
      <stop offset="50%" style="stop-color:#0d0000"/>
      <stop offset="100%" style="stop-color:#050000"/>
    </linearGradient>
    <linearGradient id="darkArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a0000"/>
      <stop offset="50%" style="stop-color:#1a0000"/>
      <stop offset="100%" style="stop-color:#0a0000"/>
    </linearGradient>
    <linearGradient id="bloodGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc143c"/>
      <stop offset="50%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#8b0000"/>
    </linearGradient>
    <filter id="armorGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="290" height="220" fill="url(#vampireKnightBg)"/>
  
  <!-- Castle hall background -->
  <g opacity="0.3" fill="#0a0000" stroke="#1a0000" stroke-width="1">
    <path d="M 0,220 L 0,100 Q 0,60 40,60 L 250,60 Q 290,60 290,100 L 290,220 Z"/>
    <rect x="60" y="80" width="40" height="140"/>
    <rect x="190" y="80" width="40" height="140"/>
  </g>
  
  <!-- Vampire Knight -->
  <g transform="translate(145, 155)" filter="url(#armorGlow)">
    <!-- Tattered cape -->
    <path d="M -65,10 Q -85,-10 -75,-50 Q -50,-70 -15,-60 Q 10,-50 40,-55 Q 70,-55 90,-45 Q 95,-5 80,10 Q 50,20 25,15 Q 0,10 -20,15 Q -40,20 -65,10" 
          fill="url(#darkArmor)" stroke="#dc143c" stroke-width="1.5" opacity="0.9"/>
    
    <!-- Armor - Pauldrons (shoulder plates) -->
    <ellipse cx="-45" cy="-10" rx="22" ry="18" fill="url(#darkArmor)" stroke="url(#bloodGold)" stroke-width="2"/>
    <ellipse cx="45" cy="-10" rx="22" ry="18" fill="url(#darkArmor)" stroke="url(#bloodGold)" stroke-width="2"/>
    <!-- Pauldron spikes -->
    <path d="M -55,-25 L -45,-40 L -35,-25" fill="url(#bloodGold)" stroke="#8b0000" stroke-width="1"/>
    <path d="M 35,-25 L 45,-40 L 55,-25" fill="url(#bloodGold)" stroke="#8b0000" stroke-width="1"/>
    
    <!-- Breastplate -->
    <path d="M -35,-10 Q -40,-30 -20,-45 Q 0,-50 20,-45 Q 40,-30 35,-10 Q 30,25 -10,35 Q -30,25 -35,-10" 
          fill="url(#darkArmor)" stroke="url(#bloodGold)" stroke-width="2"/>
    <!-- Blood rune on chest -->
    <path d="M -5,-20 L 5,-20 M 0,-25 L 0,-10 M -8,-15 L 8,-15" stroke="url(#bloodGold)" stroke-width="2.5" fill="none"/>
    
    <!-- Gauntlets -->
    <g transform="translate(-50, 30)">
      <rect x="-10" y="0" width="20" height="30" rx="3" fill="url(#darkArmor)" stroke="url(#bloodGold)" stroke-width="1.5"/>
      <path d="M -10,10 Q -15,15 -10,20 M 10,10 Q 15,15 10,20" stroke="url(#bloodGold)" stroke-width="2"/>
      <!-- Claws -->
      <path d="M -8,30 L -10,40" stroke="#dc143c" stroke-width="3" stroke-linecap="round"/>
      <path d="M 0,30 L 0,42" stroke="#dc143c" stroke-width="3" stroke-linecap="round"/>
      <path d="M 8,30 L 10,40" stroke="#dc143c" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(50, 30)">
      <rect x="-10" y="0" width="20" height="30" rx="3" fill="url(#darkArmor)" stroke="url(#bloodGold)" stroke-width="1.5"/>
      <path d="M -10,10 Q -15,15 -10,20 M 10,10 Q 15,15 10,20" stroke="url(#bloodGold)" stroke-width="2"/>
      <path d="M -8,30 L -10,40" stroke="#dc143c" stroke-width="3" stroke-linecap="round"/>
      <path d="M 0,30 L 0,42" stroke="#dc143c" stroke-width="3" stroke-linecap="round"/>
      <path d="M 8,30 L 10,40" stroke="#dc143c" stroke-width="3" stroke-linecap="round"/>
    </g>
    
    <!-- Greatsword -->
    <g transform="translate(-70, -10) rotate(-15)">
      <rect x="-4" y="-100" width="8" height="120" fill="url(#darkArmor)" stroke="#dc143c" stroke-width="1.5"/>
      <path d="M -12,-100 L 0,-120 L 12,-100 Z" fill="url(#darkArmor)" stroke="#dc143c" stroke-width="1.5"/>
      <line x1="0" y1="-120" x2="0" y2="-20" stroke="#ff6666" stroke-width="1" opacity="0.7"/>
      <rect x="-14" y="-105" width="28" height="8" fill="url(#bloodGold)" stroke="#8b0000" stroke-width="1"/>
      <rect x="-10" y="-102" width="20" height="4" fill="#dc143c"/>
    </g>
    
    <!-- Helm -->
    <path d="M -25,-50 Q -25,-70 0,-78 Q 25,-70 25,-50 Q 25,-45 20,-45 Q 15,-55 0,-55 Q -15,-55 -20,-45 Q -25,-45 -25,-50" 
          fill="url(#darkArmor)" stroke="url(#bloodGold)" stroke-width="2"/>
    <!-- Visor -->
    <rect x="-18" y="-60" width="36" height="10" fill="#050000" stroke="#dc143c" stroke-width="1"/>
    <line x1="0" y1="-60" x2="0" y2="-50" stroke="url(#bloodGold)" stroke-width="1.5" opacity="0.7"/>
    <!-- Helm crest -->
    <path d="M -10,-78 Q -10,-90 0,-95 Q 10,-90 10,-78" fill="url(#bloodGold)" stroke="#8b0000" stroke-width="1"/>
    <!-- Glowing eyes through visor -->
    <ellipse cx="-7" cy="-55" rx="3" ry="4" fill="#dc143c" filter="url(#armorGlow)"/>
    <ellipse cx="7" cy="-55" rx="3" ry="4" fill="#dc143c" filter="url(#armorGlow)"/>
    
    <!-- Tassets (hip plates) -->
    <path d="M -35,35 Q -40,50 -20,65 Q 0,70 20,65 Q 40,50 35,35 Q 30,45 -10,50 Q -30,45 -35,35" 
          fill="url(#darkArmor)" stroke="url(#bloodGold)" stroke-width="1.5"/>
  </g>
  
  <!-- Blood mist at feet -->
  <ellipse cx="145" cy="210" rx="80" ry="15" fill="#dc143c" opacity="0.15"/>
  
  <rect x="2" y="2" width="286" height="216" fill="none" stroke="url(#bloodGold)" stroke-width="2" opacity="0.5" rx="4"/>
</svg>