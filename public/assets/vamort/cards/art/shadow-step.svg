<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 220" width="290" height="220">
  <defs>
    <linearGradient id="spellVampireBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3d0000"/>
      <stop offset="100%" style="stop-color:#1a0000"/>
    </linearGradient>
    <linearGradient id="shadowBlood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b0000"/>
      <stop offset="100%" style="stop-color:#4a0000"/>
    </linearGradient>
    <radialGradient id="darkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#8b0000;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#0a0000;stop-opacity:0"/>
    </radialGradient>
    <filter id="shadowBlur">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="290" height="220" fill="url(#spellVampireBg2)"/>
  <rect width="290" height="220" fill="url(#darkGlow)"/>
  
  <!-- Shadowy tendrils from edges -->
  <g stroke="url(#shadowBlood)" stroke-width="3" fill="none" opacity="0.5" filter="url(#shadowBlur)">
    <path d="M 0,0 Q 50,50 80,30 Q 120,10 150,60 Q 180,110 140,160 Q 100,210 40,220">
      <animate attributeName="stroke-dashoffset" from="0" to="100" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M 290,0 Q 240,50 210,30 Q 170,10 140,60 Q 110,110 150,160 Q 190,210 250,220">
      <animate attributeName="stroke-dashoffset" from="0" to="100" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M 0,220 Q 50,170 80,190 Q 120,210 150,160 Q 180,110 140,60 Q 100,10 40,0">
      <animate attributeName="stroke-dashoffset" from="0" to="100" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M 290,220 Q 240,170 210,190 Q 170,210 140,160 Q 110,110 150,60 Q 190,10 250,0">
      <animate attributeName="stroke-dashoffset" from="0" to="100" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Central shadow vortex -->
  <g transform="translate(145, 110)" filter="url(#shadowBlur)">
    <!-- Swirling darkness -->
    <g fill="url(#shadowBlood)" opacity="0.6">
      <ellipse cx="0" cy="0" rx="50" ry="35">
        <animate attributeName="rx" values="50;45;50" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="35;30;35" dur="3s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="0" cy="0" rx="35" ry="25" opacity="0.8">
        <animate attributeName="rx" values="35;30;35" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="25;20;25" dur="2.5s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="0" cy="0" rx="20" ry="15" opacity="0.9">
        <animate attributeName="rx" values="20;15;20" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="15;10;15" dur="2s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    
    <!-- Rotating shadow blades -->
    <g stroke="#ffd700" stroke-width="1.5" fill="none" opacity="0.7">
      <line x1="0" y1="-40" x2="0" y2="-25">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="25" x2="0" y2="40">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/>
      </line>
      <line x1="-40" y1="0" x2="-25" y2="0">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/>
      </line>
      <line x1="25" y1="0" x2="40" y2="0">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/>
      </line>
    </g>
    
    <!-- Eyes in the darkness -->
    <ellipse cx="-15" cy="-5" rx="6" ry="8" fill="#dc143c" filter="url(#shadowBlur)">
      <animate attributeName="rx" values="6;4;6" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="15" cy="-5" rx="6" ry="8" fill="#dc143c" filter="url(#shadowBlur)">
      <animate attributeName="rx" values="6;4;6" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="15" rx="4" ry="6" fill="#dc143c" filter="url(#shadowBlur)" opacity="0.7">
      <animate attributeName="ry" values="6;3;6" dur="1.5s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  
  <!-- Shadow minions rising -->
  <g fill="#0a0000" opacity="0.5">
    <path d="M 50,200 Q 40,170 55,140 Q 60,120 50,100 Q 45,120 55,140 Q 60,170 70,200 Z">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 120,200 Q 110,165 125,135 Q 130,115 120,95 Q 115,115 125,135 Q 130,165 140,200 Z">
      <animate attributeName="opacity" values="0.4;0.7;0.4" dur="3.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 200,200 Q 190,175 205,145 Q 210,125 200,105 Q 195,125 205,145 Q 210,175 220,200 Z">
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M 240,200 Q 230,170 245,140 Q 250,120 240,100 Q 235,120 245,140 Q 250,170 260,200 Z">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Blood droplets falling -->
  <g fill="url(#shadowBlood)">
    <circle cx="80" cy="20" r="3">
      <animate attributeName="cy" values="20;220;20" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="50" r="2.5">
      <animate attributeName="cy" values="50;220;50" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="10" r="3">
      <animate attributeName="cy" values="10;220;10" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40" cy="40" r="2.5">
      <animate attributeName="cy" values="40;220;40" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <rect x="2" y="2" width="286" height="216" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.4" rx="4"/>
</svg>