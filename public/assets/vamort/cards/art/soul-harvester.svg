<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 220" width="290" height="220">
  <defs>
    <linearGradient id="harvesterBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0000"/>
      <stop offset="50%" style="stop-color:#0d0000"/>
      <stop offset="100%" style="stop-color:#050000"/>
    </linearGradient>
    <linearGradient id="scytheBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc143c"/>
      <stop offset="50%" style="stop-color:#ff4444"/>
      <stop offset="100%" style="stop-color:#8b0000"/>
    </linearGradient>
    <linearGradient id="darkRobe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a0a"/>
      <stop offset="50%" style="stop-color:#0a0000"/>
      <stop offset="100%" style="stop-color:#050000"/>
    </linearGradient>
    <linearGradient id="soulEssence" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="50%" style="stop-color:#dc143c"/>
      <stop offset="100%" style="stop-color:#8b0000"/>
    </linearGradient>
    <radialGradient id="soulGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:0.9"/>
      <stop offset="50%" style="stop-color:#dc143c;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#1a0000;stop-opacity:0"/>
    </radialGradient>
    <filter id="soulBlur">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#ffd700" flood-opacity="0.5"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="290" height="220" fill="url(#harvesterBg)"/>

  <!-- Soul particles rising from bottom -->
  <g filter="url(#soulBlur)">
    <g fill="url(#soulEssence)">
      <circle cx="60" cy="180" r="4">
        <animate attributeName="cy" values="180;20;180" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.8;0" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="r" values="4;1;4" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="120" cy="200" r="3">
        <animate attributeName="cy" values="200;30;200" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="200" cy="190" r="4">
        <animate attributeName="cy" values="190;25;190" dur="5.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.8;0" dur="5.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="240" cy="170" r="3">
        <animate attributeName="cy" values="170;40;170" dur="6.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.6;0" dur="6.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="40" cy="160" r="3">
        <animate attributeName="cy" values="160;35;160" dur="6.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="6.2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Harvester figure -->
  <g transform="translate(145, 170)">
    <!-- Tattered robe -->
    <path d="M -55,0 Q -70,-40 -60,-100 Q -30,-140 0,-150 Q 30,-140 60,-100 Q 70,-40 55,0 Q 40,20 10,15 Q -10,10 -30,15 Q -50,20 -55,0" fill="url(#darkRobe)" stroke="#3d0000" stroke-width="1" opacity="0.9"/>

    <!-- Hood - deep shadow -->
    <ellipse cx="0" cy="-115" rx="30" ry="35" fill="#020000"/>
    <path d="M -30,-100 Q -35,-130 0,-140 Q 35,-130 30,-100 Q 25,-110 0,-120 Q -25,-110 -30,-100" fill="url(#darkRobe)" stroke="#1a0000" stroke-width="1"/>

    <!-- Glowing eyes in darkness -->
    <ellipse cx="-8" cy="-115" rx="4" ry="5" fill="#dc143c" filter="url(#soulBlur)"/>
    <ellipse cx="8" cy="-115" rx="4" ry="5" fill="#dc143c" filter="url(#soulBlur)"/>

    <!-- Skeletal hands -->
    <!-- Left hand holding scythe -->
    <g transform="translate(-45, -60)">
      <path d="M 0,0 Q -5,10 0,25 Q 5,20 0,10" fill="#1a0a0a" stroke="#3d0000" stroke-width="1"/>
      <path d="M -3,25 L -8,35 M 0,25 L -5,35 M 3,25 L -2,35" stroke="#1a0a0a" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Right hand reaching for soul -->
    <g transform="translate(45, -60)">
      <path d="M 0,0 Q 5,10 0,25 Q -5,20 0,10" fill="#1a0a0a" stroke="#3d0000" stroke-width="1"/>
      <path d="M 3,25 L 8,35 M 0,25 L 5,35 M -3,25 L 2,35" stroke="#1a0a0a" stroke-width="3" stroke-linecap="round"/>
      <!-- Soul in hand -->
      <circle cx="0" cy="35" r="8" fill="url(#soulGlow)" filter="url(#soulBlur)">
        <animate attributeName="r" values="8;6;8" dur="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Scythe -->
    <g transform="translate(-50, -80) rotate(-30)">
      <!-- Handle -->
      <rect x="-2" y="0" width="4" height="160" fill="#0a0000" stroke="#3d0000" stroke-width="1"/>
      <!-- Blade -->
      <path d="M -2,0 Q -40,20 -30,60 Q -20,40 -2,20 Z" fill="url(#scytheBlade)" filter="url(#soulBlur)"/>
      <path d="M 2,0 Q 10,10 5,40 Q -5,30 2,20" fill="#ff6666" opacity="0.6"/>
      <!-- Blood runes on handle -->
      <g fill="#dc143c">
        <rect x="-5" y="40" width="10" height="3" rx="1"/>
        <rect x="-5" y="80" width="10" height="3" rx="1"/>
        <rect x="-5" y="120" width="10" height="3" rx="1"/>
      </g>
    </g>

    <!-- Soul jars at belt -->
    <g transform="translate(0, 20)">
      <g transform="translate(-35, 0)">
        <path d="M -10,0 L -10,-25 Q -10,-35 0,-35 Q 10,-35 10,-25 L 10,0 Z" fill="none" stroke="#3d0000" stroke-width="2"/>
        <ellipse cx="0" cy="-30" rx="8" ry="3" fill="#0a0000"/>
        <ellipse cx="0" cy="-20" rx="6" ry="10" fill="url(#soulGlow)" filter="url(#soulBlur)" opacity="0.7"/>
      </g>
      <g transform="translate(35, 0)">
        <path d="M -10,0 L -10,-25 Q -10,-35 0,-35 Q 10,-35 10,-25 L 10,0 Z" fill="none" stroke="#3d0000" stroke-width="2"/>
        <ellipse cx="0" cy="-30" rx="8" ry="3" fill="#0a0000"/>
        <ellipse cx="0" cy="-20" rx="6" ry="10" fill="url(#soulGlow)" filter="url(#soulBlur)" opacity="0.7"/>
      </g>
    </g>
  </g>

  <!-- Souls being pulled toward harvester -->
  <g filter="url(#soulBlur)">
    <g fill="url(#soulEssence)">
      <circle cx="145" cy="140" r="6">
        <animate attributeName="cy" values="140;90;140" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="145;140;145" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="r" values="6;3;6" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="130" cy="130" r="5">
        <animate attributeName="cy" values="130;85;130" dur="3.5s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="130;125;130" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="160" cy="135" r="5">
        <animate attributeName="cy" values="135;88;135" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="160;155;160" dur="2.8s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <rect x="2" y="2" width="286" height="216" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.4" rx="4"/>
</svg>