<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 220" width="290" height="220">
  <defs>
    <linearGradient id="spellHumanBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fffacd"/>
      <stop offset="50%" style="stop-color:#f5e6c8"/>
      <stop offset="100%" style="stop-color:#e8d5b7"/>
    </linearGradient>
    <linearGradient id="holyLight2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff"/>
      <stop offset="50%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#daa520"/>
    </linearGradient>
    <radialGradient id="blindingLight" cx="50%" cy="40%" r="70%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#ffd700;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#f5e6c8;stop-opacity:0"/>
    </radialGradient>
    <filter id="radiantGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feFlood flood-color="#ffd700" flood-opacity="0.5"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="290" height="220" fill="url(#spellHumanBg2)"/>
  <rect width="290" height="220" fill="url(#blindingLight)"/>
  
  <!-- Radiant burst from center -->
  <g transform="translate(145, 110)" filter="url(#radiantGlow)">
    <!-- Core -->
    <circle cx="0" cy="0" r="50" fill="url(#holyLight2)" opacity="0.9"/>
    <circle cx="0" cy="0" r="35" fill="#fff" opacity="0.95">
      <animate attributeName="r" values="30;40;30" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;1;0.9" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="18" fill="url(#holyLight2)" opacity="1">
      <animate attributeName="r" values="15;22;15" dur="1s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Expanding rings -->
    <g fill="none" stroke="url(#holyLight2)" stroke-width="2" opacity="0.7">
      <circle cx="0" cy="0" r="55">
        <animate attributeName="r" values="55;85;55" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0;0.7" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="70">
        <animate attributeName="r" values="70;100;70" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0;0.5" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="85">
        <animate attributeName="r" values="85;115;85" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0;0.3" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Radiant spokes -->
    <g stroke="url(#holyLight2)" stroke-width="1.5" opacity="0.8">
      <line x1="0" y1="-90" x2="0" y2="-60">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="10s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="60" x2="0" y2="90">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="10s" repeatCount="indefinite"/>
      </line>
      <line x1="-90" y1="0" x2="-60" y2="0">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="10s" repeatCount="indefinite"/>
      </line>
      <line x1="60" y1="0" x2="90" y2="0">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="10s" repeatCount="indefinite"/>
      </line>
      <line x1="-64" y1="-64" x2="-42" y2="-42">
        <animateTransform attributeName="transform" type="rotate" from="45 0 0" to="405 0 0" dur="10s" repeatCount="indefinite"/>
      </line>
      <line x1="42" y1="42" x2="64" y2="64">
        <animateTransform attributeName="transform" type="rotate" from="45 0 0" to="405 0 0" dur="10s" repeatCount="indefinite"/>
      </line>
      <line x1="-64" y1="64" x2="-42" y2="42">
        <animateTransform attributeName="transform" type="rotate" from="-45 0 0" to="315 0 0" dur="10s" repeatCount="indefinite"/>
      </line>
      <line x1="42" y1="-42" x2="64" y2="-64">
        <animateTransform attributeName="transform" type="rotate" from="-45 0 0" to="315 0 0" dur="10s" repeatCount="indefinite"/>
      </line>
    </g>
    
    <!-- Cross at center -->
    <g stroke="url(#holyLight2)" stroke-width="4" opacity="1">
      <line x1="0" y1="-20" x2="0" y2="20">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="20s" repeatCount="indefinite"/>
      </line>
      <line x1="-20" y1="0" x2="20" y2="0">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="20s" repeatCount="indefinite"/>
      </line>
    </g>
    
    <!-- Holy symbols orbiting -->
    <g font-family="Georgia, serif" font-size="16" fill="url(#holyLight2)" text-anchor="middle" opacity="0.9">
      <text x="0" y="-50">✝</text>
      <text x="0" y="55">✝</text>
      <text x="-50" y="5">✝</text>
      <text x="50" y="5">✝</text>
      <text x="-35" y="-35" style="font-size:12px">✝</text>
      <text x="35" y="-35" style="font-size:12px">✝</text>
      <text x="-35" y="40" style="font-size:12px">✝</text>
      <text x="35" y="40" style="font-size:12px">✝</text>
    </g>
  </g>
  
  <!-- Light rays from top (divine intervention) -->
  <g stroke="url(#holyLight2)" stroke-width="2" opacity="0.3">
    <line x1="50" y1="0" x2="70" y2="220"/>
    <line x1="100" y1="0" x2="110" y2="220"/>
    <line x1="145" y1="0" x2="145" y2="220">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="190" y1="0" x2="180" y2="220"/>
    <line x1="240" y1="0" x2="220" y2="220"/>
  </g>
  
  <!-- Floating motes of light -->
  <g fill="url(#holyLight2)">
    <circle cx="30" cy="30" r="2">
      <animate attributeName="cy" values="30;10;30" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="40" r="1.5">
      <animate attributeName="cy" values="40;15;40" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40" cy="180" r="2">
      <animate attributeName="cy" values="180;160;180" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="190" r="1.5">
      <animate attributeName="cy" values="190;170;190" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="200" r="1">
      <animate attributeName="cy" values="200;185;200" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="210" cy="200" r="1">
      <animate attributeName="cy" values="200;180;200" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Blessed ground at bottom -->
  <ellipse cx="145" cy="215" rx="120" ry="15" fill="url(#holyLight2)" opacity="0.3"/>
  
  <rect x="2" y="2" width="286" height="216" fill="none" stroke="url(#holyLight2)" stroke-width="2" opacity="0.6" rx="4"/>
</svg>