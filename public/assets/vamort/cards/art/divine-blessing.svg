<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 220" width="290" height="220">
  <defs>
    <linearGradient id="spellHumanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fffacd"/>
      <stop offset="50%" style="stop-color:#f0e68c"/>
      <stop offset="100%" style="stop-color:#e8d5b7"/>
    </linearGradient>
    <linearGradient id="holyMagic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="50%" style="stop-color:#fffacd"/>
      <stop offset="100%" style="stop-color:#daa520"/>
    </linearGradient>
    <radialGradient id="blessingGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#fffacd;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#f5e6c8;stop-opacity:0"/>
    </radialGradient>
    <filter id="blessingGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#ffd700" flood-opacity="0.5"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="290" height="220" fill="url(#spellHumanBg)"/>
  <rect width="290" height="220" fill="url(#blessingGlow)"/>
  
  <!-- Divine light beams -->
  <g transform="translate(145, 110)" filter="url(#blessingGlow)">
    <!-- Central star/sun -->
    <circle cx="0" cy="0" r="50" fill="url(#holyMagic)" opacity="0.6"/>
    <circle cx="0" cy="0" r="40" fill="#fffacd" opacity="0.8"/>
    <circle cx="0" cy="0" r="25" fill="url(#holyMagic)" opacity="0.9"/>
    
    <!-- Radiating lines -->
    <g stroke="url(#holyMagic)" stroke-width="2" opacity="0.8">
      <line x1="0" y1="-70" x2="0" y2="-55"/>
      <line x1="0" y1="55" x2="0" y2="70"/>
      <line x1="-70" y1="0" x2="-55" y2="0"/>
      <line x1="55" y1="0" x2="70" y2="0"/>
      <line x1="-50" y1="-50" x2="-38" y2="-38"/>
      <line x1="38" y1="38" x2="50" y2="50"/>
      <line x1="-50" y1="50" x2="-38" y2="38"/>
      <line x1="38" y1="-38" x2="50" y2="-50"/>
    </g>
    
    <!-- Rotating cross -->
    <g stroke="url(#holyMagic)" stroke-width="3" opacity="0.9">
      <line x1="0" y1="-35" x2="0" y2="35">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="20s" repeatCount="indefinite"/>
      </line>
      <line x1="-35" y1="0" x2="35" y2="0">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="20s" repeatCount="indefinite"/>
      </line>
    </g>
    
    <!-- Outer rotating ring -->
    <circle cx="0" cy="0" r="65" fill="none" stroke="url(#holyMagic)" stroke-width="1.5" opacity="0.5" stroke-dasharray="10,5">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="15s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Holy symbols orbiting -->
    <g font-family="Georgia, serif" font-size="14" fill="url(#holyMagic)" text-anchor="middle">
      <text x="0" y="-55" opacity="0.8">✝</text>
      <text x="0" y="60" opacity="0.8">✝</text>
      <text x="-55" y="5" opacity="0.8">✝</text>
      <text x="55" y="5" opacity="0.8">✝</text>
      <text x="-40" y="-40" opacity="0.6" style="font-size:10px">✝</text>
      <text x="40" y="-40" opacity="0.6" style="font-size:10px">✝</text>
      <text x="-40" y="45" opacity="0.6" style="font-size:10px">✝</text>
      <text x="40" y="45" opacity="0.6" style="font-size:10px">✝</text>
    </g>
  </g>
  
  <!-- Sacred geometry background -->
  <g stroke="#daa520" stroke-width="0.5" opacity="0.15" fill="none">
    <!-- Hexagram -->
    <polygon points="145,20 195,55 195,125 145,160 95,125 95,55"/>
    <polygon points="145,160 95,125 195,125"/>
    <polygon points="145,20 95,55 195,55"/>
    <!-- Circle -->
    <circle cx="145" cy="90" r="75"/>
    <!-- Triangle -->
    <polygon points="145,15 220,165 70,165"/>
    <polygon points="145,165 70,55 220,55"/>
  </g>
  
  <!-- Floating holy particles -->
  <g fill="url(#holyMagic)">
    <circle cx="60" cy="40" r="2.5">
      <animate attributeName="cy" values="40;20;40" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="230" cy="60" r="2">
      <animate attributeName="cy" values="60;35;60" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40" cy="150" r="2.5">
      <animate attributeName="cy" values="150;125;150" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="170" r="2">
      <animate attributeName="cy" values="170;145;170" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="200" r="1.5">
      <animate attributeName="cy" values="200;180;200" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="190" cy="200" r="1.5">
      <animate attributeName="cy" values="200;175;200" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Open holy book at bottom -->
  <g transform="translate(145, 190)" opacity="0.7">
    <path d="M -40,0 Q -40,-20 -20,-25 L 20,-25 Q 40,-20 40,0 L 40,20 L -40,20 Z" fill="#f5f5dc" stroke="#daa520" stroke-width="1.5"/>
    <path d="M -40,0 L -40,20 M 40,0 L 40,20 M 0,-25 L 0,20" stroke="#daa520" stroke-width="1" opacity="0.5"/>
    <text x="-25" y="8" font-family="Georgia, serif" font-size="8" fill="#8b7b4a">S A G R A D O</text>
    <text x="5" y="8" font-family="Georgia, serif" font-size="8" fill="#8b7b4a">T E X T O</text>
  </g>
  
  <rect x="2" y="2" width="286" height="216" fill="none" stroke="url(#holyMagic)" stroke-width="2" opacity="0.6" rx="4"/>
</svg>