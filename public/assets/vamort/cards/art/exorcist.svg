<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 220" width="290" height="220">
  <defs>
    <linearGradient id="exorcistBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f0f23"/>
    </linearGradient>
    <linearGradient id="purpleRobe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a0080"/>
      <stop offset="50%" style="stop-color:#2a004a"/>
      <stop offset="100%" style="stop-color:#1a002a"/>
    </linearGradient>
    <linearGradient id="silverCross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f0f0"/>
      <stop offset="50%" style="stop-color:#c0c0c0"/>
      <stop offset="100%" style="stop-color:#a0a0a0"/>
    </linearGradient>
    <linearGradient id="holyFire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff"/>
      <stop offset="30%" style="stop-color:#ffd700"/>
      <stop offset="60%" style="stop-color:#ff8c00"/>
      <stop offset="100%" style="stop-color:#dc143c"/>
    </linearGradient>
    <radialGradient id="banishGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.9"/>
      <stop offset="50%" style="stop-color:#ffd700;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#ff8c00;stop-opacity:0"/>
    </radialGradient>
    <filter id="holyFireGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#ffd700" flood-opacity="0.7"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="290" height="220" fill="url(#exorcistBg)"/>

  <!-- Dark ritual circle on floor (being banished) -->
  <g transform="translate(145, 170)" opacity="0.2" stroke="#dc143c" stroke-width="1.5" fill="none">
    <circle cx="0" cy="0" r="70">
      <animate attributeName="opacity" values="0.2;0.05;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="50"/>
    <path d="M 0,-70 L 0,-50 M 0,50 L 0,70 M -70,0 L -50,0 M 50,0 L 70,0"/>
  </g>

  <!-- Banished shadows fleeing -->
  <g fill="#050510" opacity="0.6">
    <path d="M 80,180 Q 70,140 90,120 Q 100,100 85,80 Q 80,100 90,120 Q 100,140 110,180 Z">
      <animate attributeName="opacity" values="0.6;0.2;0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="transform" values="translate(0,0); translate(-20,-50); translate(-40,-100)" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 210,180 Q 220,140 200,120 Q 190,100 205,80 Q 210,100 200,120 Q 190,140 180,180 Z">
      <animate attributeName="opacity" values="0.6;0.2;0" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="transform" values="translate(0,0); translate(20,-50); translate(40,-100)" dur="3.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 145,180 Q 135,135 155,115 Q 165,95 150,75 Q 145,95 155,115 Q 165,135 175,180 Z">
      <animate attributeName="opacity" values="0.6;0.2;0" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="transform" values="translate(0,0); translate(0,-50); translate(0,-100)" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Exorcist figure -->
  <g transform="translate(145, 155)">
    <!-- Purple/black robes -->
    <path d="M -50,0 Q -60,-30 -50,-90 Q -30,-125 0,-135 Q 30,-125 50,-90 Q 60,-30 50,0 Q 40,20 0,25 Q -40,20 -50,0" fill="url(#purpleRobe)" stroke="#3a0060" stroke-width="1.5"/>

    <!-- Silver embroidery on robes -->
    <g stroke="url(#silverCross)" stroke-width="1.5" fill="none" opacity="0.7">
      <path d="M -20,0 Q -15,-20 -10,-40 Q -5,-60 0,-70 Q 5,-60 10,-40 Q 15,-20 20,0"/>
      <path d="M 0,-10 L 0,-80"/>
      <path d="M -35,-20 L 35,-20"/>
    </g>

    <!-- Hood -->
    <path d="M -35,-90 Q -40,-115 0,-125 Q 40,-115 35,-90 Q 30,-95 0,-105 Q -30,-95 -35,-90" fill="url(#purpleRobe)" stroke="#2a004a" stroke-width="1"/>
    <!-- Face in shadow -->
    <ellipse cx="0" cy="-108" rx="16" ry="14" fill="#0a0a1a"/>
    <!-- Intense glowing eyes -->
    <ellipse cx="-5" cy="-110" rx="3" ry="4" fill="#fff" filter="url(#holyFireGlow)"/>
    <ellipse cx="5" cy="-110" rx="3" ry="4" fill="#fff" filter="url(#holyFireGlow)"/>

    <!-- Hands - one holding cross, one banishing -->
    <!-- Left hand with cross -->
    <g transform="translate(-40, -40)">
      <path d="M 0,0 Q -5,10 0,25 Q 5,20 0,10" fill="#1a1a3e" stroke="#3a0060" stroke-width="1"/>
      <path d="M -3,25 L -8,35 M 0,25 L -5,35 M 3,25 L -2,35" stroke="#1a1a3e" stroke-width="3" stroke-linecap="round"/>
      <!-- Silver cross -->
      <g filter="url(#holyFireGlow)">
        <rect x="-4" y="35" width="8" height="35" fill="url(#silverCross)" stroke="#fff" stroke-width="1"/>
        <rect x="-14" y="50" width="28" height="8" fill="url(#silverCross)" stroke="#fff" stroke-width="1"/>
        <rect x="-2" y="60" width="4" height="10" fill="url(#silverCross)"/>
      </g>
      <!-- Holy fire from cross -->
      <path d="M -10,40 Q -20,20 -15,0 Q -5,-10 0,0 Q 5,-10 15,0 Q 20,20 10,40" fill="url(#holyFire)" filter="url(#holyFireGlow)" opacity="0.9">
        <animate attributeName="d" values="M -10,40 Q -20,20 -15,0 Q -5,-10 0,0 Q 5,-10 15,0 Q 20,20 10,40; M -10,40 Q -22,25 -12,-5 Q -5,-15 0,-5 Q 5,-15 12,-5 Q 22,25 10,40; M -10,40 Q -20,20 -15,0 Q -5,-10 0,0 Q 5,-10 15,0 Q 20,20 10,40" dur="1.5s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Right hand banishing -->
    <g transform="translate(40, -40)">
      <path d="M 0,0 Q 5,10 0,25 Q -5,20 0,10" fill="#1a1a3e" stroke="#3a0060" stroke-width="1"/>
      <path d="M 3,25 L 8,35 M 0,25 L 5,35 M -3,25 L 2,35" stroke="#1a1a3e" stroke-width="3" stroke-linecap="round"/>
      <!-- Banishing wave -->
      <g filter="url(#holyFireGlow)">
        <path d="M 0,30 Q 20,20 30,5 Q 25,-5 15,0 Q 20,15 0,30" fill="url(#banishGlow)" opacity="0.8">
          <animate attributeName="d" values="M 0,30 Q 20,20 30,5 Q 25,-5 15,0 Q 20,15 0,30; M 0,30 Q 25,25 35,0 Q 30,-10 15,0 Q 25,15 0,30; M 0,30 Q 20,20 30,5 Q 25,-5 15,0 Q 20,15 0,30" dur="1s" repeatCount="indefinite"/>
        </path>
        <path d="M 0,35 Q -20,20 -30,5 Q -25,-5 -15,0 Q -20,15 0,35" fill="url(#banishGlow)" opacity="0.8">
          <animate attributeName="d" values="M 0,35 Q -20,20 -30,5 Q -25,-5 -15,0 Q -20,15 0,35; M 0,35 Q -25,25 -35,0 Q -30,-10 -15,0 Q -25,15 0,35; M 0,35 Q -20,20 -30,5 Q -25,-5 -15,0 Q -20,15 0,35" dur="1s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

    <!-- Holy water vial at belt -->
    <g transform="translate(0, 30)">
      <path d="M -8,0 L -8,-25 Q -8,-32 -2,-32 Q 4,-32 4,-25 L 4,0 Z" fill="url(#holyFire)" filter="url(#holyFireGlow)" opacity="0.7"/>
      <ellipse cx="-2" cy="-30" rx="4" ry="2" fill="#fff" opacity="0.9"/>
    </g>
  </g>

  <!-- Floating scripture pages burning -->
  <g transform="translate(145, 100)">
    <g filter="url(#holyFireGlow)">
      <rect x="-80" y="-30" width="40" height="50" fill="#f5e6c8" transform="rotate(-15)">
        <animate attributeName="transform" values="rotate(-15); rotate(-10); rotate(-15)" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0.4;0.8" dur="3s" repeatCount="indefinite"/>
      </rect>
      <rect x="40" y="-40" width="35" height="45" fill="#f5e6c8" transform="rotate(10)">
        <animate attributeName="transform" values="rotate(10); rotate(15); rotate(10)" dur="3.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="-10" y="10" width="30" height="40" fill="#f5e6c8" transform="rotate(5)">
        <animate attributeName="transform" values="rotate(5); rotate(-5); rotate(5)" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <rect x="2" y="2" width="286" height="216" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.5" rx="4"/>
</svg>