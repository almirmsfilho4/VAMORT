<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 220" width="290" height="220">
  <defs>
    <linearGradient id="locationBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d0000"/>
      <stop offset="50%" style="stop-color:#1a0000"/>
      <stop offset="100%" style="stop-color:#0d0000"/>
    </linearGradient>
    <linearGradient id="bloodFountain" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#8b0000"/>
      <stop offset="30%" style="stop-color:#dc143c"/>
      <stop offset="60%" style="stop-color:#ff4444"/>
      <stop offset="100%" style="stop-color:#ff6666"/>
    </linearGradient>
    <linearGradient id="stoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2a"/>
      <stop offset="50%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <radialGradient id="poolGlow" cx="50%" cy="100%" r="50%">
      <stop offset="0%" style="stop-color:#dc143c;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#1a0000;stop-opacity:0"/>
    </radialGradient>
    <filter id="bloodGlow2">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#dc143c" flood-opacity="0.5"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="290" height="220" fill="url(#locationBg)"/>
  
  <!-- Gothic architecture background -->
  <g fill="url(#stoneGrad)" stroke="#1a1a1a" stroke-width="1" opacity="0.5">
    <!-- Left arch -->
    <path d="M 0,220 L 0,100 Q 0,60 40,60 L 80,60 Q 80,20 100,20 L 130,20 Q 130,60 170,60 L 170,220 Z"/>
    <!-- Right arch -->
    <path d="M 120,220 L 120,100 Q 120,60 160,60 L 200,60 Q 200,20 220,20 L 250,20 Q 250,60 290,60 L 290,220 Z"/>
    <!-- Center spire -->
    <path d="M 130,100 L 145,10 Q 160,10 160,100 Z"/>
  </g>
  
  <!-- Blood fountain center -->
  <g transform="translate(145, 160)" filter="url(#bloodGlow2)">
    <!-- Fountain base -->
    <ellipse cx="0" cy="20" rx="50" ry="15" fill="url(#stoneGrad)" stroke="#3d0000" stroke-width="2"/>
    <ellipse cx="0" cy="15" rx="45" ry="12" fill="#1a0000"/>
    
    <!-- Basin -->
    <ellipse cx="0" cy="-10" rx="45" ry="20" fill="none" stroke="#3d0000" stroke-width="3"/>
    <ellipse cx="0" cy="-10" rx="42" ry="18" fill="url(#poolGlow)"/>
    
    <!-- Blood jets -->
    <g fill="url(#bloodFountain)">
      <!-- Center jet -->
      <path d="M 0,-10 Q 0,-80 -5,-100 Q 0,-110 5,-100 Q 0,-80 0,-10">
        <animate attributeName="d" values="M 0,-10 Q 0,-80 -5,-100 Q 0,-110 5,-100 Q 0,-80 0,-10; M 0,-10 Q 0,-85 -3,-105 Q 0,-115 3,-105 Q 0,-85 0,-10; M 0,-10 Q 0,-80 -5,-100 Q 0,-110 5,-100 Q 0,-80 0,-10" dur="1s" repeatCount="indefinite"/>
      </path>
      <!-- Side jets -->
      <path d="M -20,-10 Q -20,-70 -25,-85 Q -15,-80 -15,-10">
        <animate attributeName="d" values="M -20,-10 Q -20,-70 -25,-85 Q -15,-80 -15,-10; M -20,-10 Q -20,-75 -23,-90 Q -17,-85 -15,-10; M -20,-10 Q -20,-70 -25,-85 Q -15,-80 -15,-10" dur="1.2s" repeatCount="indefinite"/>
      </path>
      <path d="M 20,-10 Q 20,-70 25,-85 Q 15,-80 15,-10">
        <animate attributeName="d" values="M 20,-10 Q 20,-70 25,-85 Q 15,-80 15,-10; M 20,-10 Q 20,-75 23,-90 Q 17,-85 15,-10; M 20,-10 Q 20,-70 25,-85 Q 15,-80 15,-10" dur="1.2s" repeatCount="indefinite"/>
      </path>
      <path d="M -35,-10 Q -35,-55 -40,-65 Q -30,-60 -30,-10">
        <animate attributeName="d" values="M -35,-10 Q -35,-55 -40,-65 Q -30,-60 -30,-10; M -35,-10 Q -35,-60 -38,-70 Q -32,-65 -30,-10; M -35,-10 Q -35,-55 -40,-65 Q -30,-60 -30,-10" dur="1.5s" repeatCount="indefinite"/>
      </path>
      <path d="M 35,-10 Q 35,-55 40,-65 Q 30,-60 30,-10">
        <animate attributeName="d" values="M 35,-10 Q 35,-55 40,-65 Q 30,-60 30,-10; M 35,-10 Q 35,-60 38,-70 Q 32,-65 30,-10; M 35,-10 Q 35,-55 40,-65 Q 30,-60 30,-10" dur="1.5s" repeatCount="indefinite"/>
      </path>
    </g>
    
    <!-- Blood droplets falling back -->
    <g fill="#dc143c" opacity="0.7">
      <circle cx="-15" cy="-60" r="2">
        <animate attributeName="cy" values="-60;20;-60" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0.3;0.7" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="15" cy="-65" r="2">
        <animate attributeName="cy" values="-65;20;-65" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0.3;0.7" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-30" cy="-45" r="1.5">
        <animate attributeName="cy" values="-45;20;-45" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="30" cy="-50" r="1.5">
        <animate attributeName="cy" values="-50;20;-50" dur="1.7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0.2;0.5" dur="1.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="-90" r="2.5">
        <animate attributeName="cy" values="-90;20;-90" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  
  <!-- Blood pool on ground -->
  <ellipse cx="145" cy="210" rx="80" ry="15" fill="url(#poolGlow)" opacity="0.8"/>
  <ellipse cx="145" cy="210" rx="60" ry="12" fill="#dc143c" opacity="0.6">
    <animate attributeName="rx" values="60;55;60" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="12;10;12" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Gargoyles on arches -->
  <g fill="#0a0000" opacity="0.6">
    <!-- Left gargoyle -->
    <path d="M 30,60 Q 25,40 40,30 Q 50,40 45,60 Q 40,50 30,60"/>
    <path d="M 35,55 Q 40,45 45,55"/>
    <!-- Right gargoyle -->
    <path d="M 260,60 Q 265,40 250,30 Q 240,40 245,60 Q 250,50 260,60"/>
    <path d="M 255,55 Q 250,45 245,55"/>
  </g>
  
  <!-- Vampire worshippers at base -->
  <g fill="#0a0000" opacity="0.4">
    <path d="M 60,200 Q 55,180 70,170 Q 75,180 65,200 Z"/>
    <path d="M 230,200 Q 235,180 220,170 Q 215,180 225,200 Z"/>
    <path d="M 110,200 Q 105,175 120,165 Q 125,175 115,200 Z"/>
    <path d="M 180,200 Q 185,175 170,165 Q 165,175 175,200 Z"/>
  </g>
  
  <!-- Blood mist rising -->
  <g fill="#dc143c" opacity="0.15">
    <ellipse cx="145" cy="180" rx="100" ry="30">
      <animate attributeName="cy" values="180;160;180" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.2;0.1" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="145" cy="140" rx="80" ry="25" opacity="0.1">
      <animate attributeName="cy" values="140;115;140" dur="5s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  
  <rect x="2" y="2" width="286" height="216" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.4" rx="4"/>
</svg>