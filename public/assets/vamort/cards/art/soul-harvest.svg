<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 220" width="290" height="220">
  <defs>
    <linearGradient id="harvestBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0000"/>
      <stop offset="50%" style="stop-color:#0d0000"/>
      <stop offset="100%" style="stop-color:#050000"/>
    </linearGradient>
    <linearGradient id="bloodScythe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc143c"/>
      <stop offset="50%" style="stop-color:#ff4444"/>
      <stop offset="100%" style="stop-color:#8b0000"/>
    </linearGradient>
    <linearGradient id="soulGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="50%" style="stop-color:#ff8c00"/>
      <stop offset="100%" style="stop-color:#dc143c"/>
    </linearGradient>
    <radialGradient id="soulCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#ff8c00;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#1a0000;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="harvestGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#dc143c;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#050000;stop-opacity:0"/>
    </radialGradient>
    <filter id="soulHarvestGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#ffd700" flood-opacity="0.6"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bloodMist">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="290" height="220" fill="url(#harvestBg)"/>

  <!-- Blood mist covering the field -->
  <g filter="url(#bloodMist)" fill="#dc143c" opacity="0.15">
    <ellipse cx="145" cy="150" rx="150" ry="80">
      <animate attributeName="cy" values="150;130;150" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.25;0.15" dur="6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="145" cy="100" rx="120" ry="60" opacity="0.1">
      <animate attributeName="cy" values="100;80;100" dur="7s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Fallen enemies (silhouettes) -->
  <g fill="#030000" opacity="0.6">
    <path d="M 40,190 Q 35,160 50,140 Q 55,120 45,100 Q 40,120 50,140 Q 55,160 65,190 Z"/>
    <path d="M 110,190 Q 105,155 120,130 Q 125,110 115,90 Q 110,110 120,130 Q 125,155 135,190 Z"/>
    <path d="M 190,190 Q 185,165 200,140 Q 205,120 195,100 Q 190,120 200,140 Q 205,165 215,190 Z"/>
    <path d="M 250,190 Q 245,160 260,135 Q 265,115 255,95 Q 250,115 260,135 Q 265,160 275,190 Z"/>
  </g>

  <!-- Giant spectral scythe sweeping across -->
  <g transform="translate(145, 110)" filter="url(#soulHarvestGlow)">
    <!-- Scythe handle -->
    <rect x="-4" y="-100" width="8" height="200" fill="#0a0000" stroke="#3d0000" stroke-width="1"/>
    <g transform="translate(0, -100) rotate(-45)">
      <!-- Blade -->
      <path d="M -60,0 Q -80,30 -50,80 Q -30,60 -4,20 Z" fill="url(#bloodScythe)">
        <animate attributeName="d" values="M -60,0 Q -80,30 -50,80 Q -30,60 -4,20 Z; M -65,0 Q -85,35 -55,85 Q -35,65 -4,20 Z; M -60,0 Q -80,30 -50,80 Q -30,60 -4,20 Z" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M -40,10 Q -30,40 -10,60 Q -20,40 -4,20" fill="#ff6666" opacity="0.6"/>
      <!-- Runes on blade -->
      <g fill="#ffd700">
        <text x="-35" y="30" font-family="Georgia, serif" font-size="12" text-anchor="middle">☥</text>
        <text x="-35" y="55" font-family="Georgia, serif" font-size="10" text-anchor="middle">†</text>
      </g>
    </g>

    <!-- Blood dripping from blade -->
    <g fill="url(#bloodScythe)">
      <circle cx="25" cy="30" r="4">
        <animate attributeName="cy" values="30;100;30" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="r" values="4;1;4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="30" cy="40" r="3">
        <animate attributeName="cy" values="40;110;40" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="20" cy="50" r="3">
        <animate attributeName="cy" values="50;120;50" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Souls being harvested - rising from fallen -->
  <g filter="url(#soulHarvestGlow)">
    <g fill="url(#soulGold)">
      <!-- From first fallen -->
      <circle cx="50" cy="150" r="6">
        <animate attributeName="cy" values="150;50;150" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="50;145;50" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="r" values="6;2;6" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
      </circle>
      <!-- From second fallen -->
      <circle cx="120" cy="140" r="5">
        <animate attributeName="cy" values="140;45;140" dur="4.5s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="120;145;120" dur="4.5s" repeatCount="indefinite"/>
        <animate attributeName="r" values="5;2;5" dur="4.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="4.5s" repeatCount="indefinite"/>
      </circle>
      <!-- From third fallen -->
      <circle cx="200" cy="150" r="6">
        <animate attributeName="cy" values="150;55;150" dur="3.8s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="200;145;200" dur="3.8s" repeatCount="indefinite"/>
        <animate attributeName="r" values="6;2;6" dur="3.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="3.8s" repeatCount="indefinite"/>
      </circle>
      <!-- From fourth fallen -->
      <circle cx="260" cy="145" r="5">
        <animate attributeName="cy" values="145;50;145" dur="4.2s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="260;145;260" dur="4.2s" repeatCount="indefinite"/>
        <animate attributeName="r" values="5;2;5" dur="4.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="4.2s" repeatCount="indefinite"/>
      </circle>

      <!-- Additional souls from around the field -->
      <circle cx="80" cy="180" r="4">
        <animate attributeName="cy" values="180;60;180" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="80;145;80" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="220" cy="170" r="4">
        <animate attributeName="cy" values="170;65;170" dur="4.8s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="220;145;220" dur="4.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="40" cy="120" r="3">
        <animate attributeName="cy" values="120;40;120" dur="5.5s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="40;145;40" dur="5.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="250" cy="110" r="3">
        <animate attributeName="cy" values="110;45;110" dur="5.2s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="250;145;250" dur="5.2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Ghouls rising from the blood pool -->
  <g fill="#0a0000" opacity="0.7">
    <path d="M 70,190 Q 65,170 80,160 Q 85,170 75,190 Z">
      <animate attributeName="opacity" values="0;0.7;0.7" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="transform" values="translate(0,0); translate(0,-30); translate(0,-30)" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 130,190 Q 125,165 140,155 Q 145,165 135,190 Z">
      <animate attributeName="opacity" values="0;0.7;0.7" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="transform" values="translate(0,0); translate(0,-35); translate(0,-35)" dur="3.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 210,190 Q 205,175 220,165 Q 225,175 215,190 Z">
      <animate attributeName="opacity" values="0;0.7;0.7" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="transform" values="translate(0,0); translate(0,-25); translate(0,-25)" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Blood pool center with souls swirling -->
  <g transform="translate(145, 180)" filter="url(#soulHarvestGlow)">
    <ellipse cx="0" cy="0" rx="50" ry="15" fill="url(#harvestGlow)" opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="35" ry="10" fill="#dc143c" opacity="0.6">
      <animate attributeName="rx" values="35;30;35" dur="1.5s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Soul vortex -->
    <g fill="url(#soulCore)">
      <circle cx="-15" cy="-5" r="5">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="r" values="5;3;5" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="15" cy="-5" r="4">
        <animateTransform attributeName="transform" type="rotate" from="180 0 0" to="540 0 0" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="10" r="3">
        <animateTransform attributeName="transform" type="rotate" from="90 0 0" to="450 0 0" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Blood resource counters floating up -->
  <g font-family="Georgia, serif" font-size="18" fill="url(#bloodScythe)" font-weight="bold" text-anchor="middle" filter="url(#soulHarvestGlow)">
    <text x="100" y="100" opacity="0.8">+1</text>
    <text x="145" y="80" opacity="0.9">+1</text>
    <text x="190" y="100" opacity="0.8">+1</text>
    <text x="145" y="120" style="font-size:24" opacity="1">+4</text>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
  </g>

  <rect x="2" y="2" width="286" height="216" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.4" rx="4"/>
</svg>