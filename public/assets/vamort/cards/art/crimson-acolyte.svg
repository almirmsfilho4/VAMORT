<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 220" width="290" height="220">
  <defs>
    <linearGradient id="acolyteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d0000"/>
      <stop offset="50%" style="stop-color:#1a0000"/>
      <stop offset="100%" style="stop-color:#0d0000"/>
    </linearGradient>
    <linearGradient id="robeRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b0000"/>
      <stop offset="50%" style="stop-color:#5a0000"/>
      <stop offset="100%" style="stop-color:#2a0000"/>
    </linearGradient>
    <linearGradient id="bloodGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="50%" style="stop-color:#daa520"/>
      <stop offset="100%" style="stop-color:#8b0000"/>
    </linearGradient>
    <radialGradient id="chaliceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#dc143c;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#1a0000;stop-opacity:0"/>
    </radialGradient>
    <filter id="bloodGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#dc143c" flood-opacity="0.6"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="290" height="220" fill="url(#acolyteBg)"/>

  <!-- Gothic arch background -->
  <path d="M 0,220 L 0,80 Q 0,40 40,40 L 250,40 Q 290,40 290,80 L 290,220 Z" fill="none" stroke="#3d0000" stroke-width="2" opacity="0.3"/>

  <!-- Acolyte figure -->
  <g transform="translate(145, 180)">
    <!-- Robe -->
    <path d="M -50,0 Q -60,-30 -50,-80 Q -30,-110 0,-120 Q 30,-110 50,-80 Q 60,-30 50,0 Z" fill="url(#robeRed)" stroke="#1a0000" stroke-width="1.5"/>

    <!-- Hood -->
    <path d="M -35,-80 Q -35,-100 0,-110 Q 35,-100 35,-80 Q 30,-85 0,-95 Q -30,-85 -35,-80" fill="url(#robeRed)" stroke="#1a0000" stroke-width="1"/>
    <ellipse cx="0" cy="-95" rx="22" ry="18" fill="#050000" opacity="0.8"/>

    <!-- Face shadow -->
    <ellipse cx="0" cy="-92" rx="16" ry="14" fill="#0a0000"/>
    <!-- Glowing eyes -->
    <ellipse cx="-6" cy="-94" rx="2.5" ry="3" fill="#dc143c" filter="url(#bloodGlow)"/>
    <ellipse cx="6" cy="-94" rx="2.5" ry="3" fill="#dc143c" filter="url(#bloodGlow)"/>

    <!-- Hands holding chalice -->
    <g transform="translate(0, -40)">
      <!-- Left hand -->
      <path d="M -20,0 Q -25,5 -20,15 Q -15,10 -12,0" fill="#2a0000" stroke="#3d0000" stroke-width="1"/>
      <!-- Right hand -->
      <path d="M 20,0 Q 25,5 20,15 Q 15,10 12,0" fill="#2a0000" stroke="#3d0000" stroke-width="1"/>

      <!-- Chalice -->
      <g filter="url(#bloodGlow)">
        <path d="M -12,15 Q -12,5 -8,0 Q -4,-5 0,0 Q 4,-5 8,0 Q 12,5 12,15" fill="none" stroke="url(#bloodGold)" stroke-width="3"/>
        <ellipse cx="0" cy="0" rx="10" ry="4" fill="url(#chaliceGlow)"/>
        <ellipse cx="0" cy="0" rx="8" ry="3" fill="#dc143c" opacity="0.9">
          <animate attributeName="ry" values="3;2.5;3" dur="2s" repeatCount="indefinite"/>
        </ellipse>
        <!-- Base -->
        <ellipse cx="0" cy="15" rx="8" ry="3" fill="url(#bloodGold)"/>
        <ellipse cx="0" cy="18" rx="6" ry="2" fill="#8b0000"/>
      </g>
    </g>

    <!-- Blood drips from chalice -->
    <g fill="#dc143c" opacity="0.7">
      <circle cx="-5" cy="5" r="2">
        <animate attributeName="cy" values="5;35;5" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="5" cy="10" r="1.5">
        <animate attributeName="cy" values="10;40;10" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Ritual symbols on robe -->
    <g fill="url(#bloodGold)" opacity="0.6" font-family="Georgia, serif" font-size="14" text-anchor="middle">
      <text x="-25" y="-50">†</text>
      <text x="25" y="-50">†</text>
      <text x="0" y="-30" style="font-size:18">☥</text>
      <text x="-20" y="-10" style="font-size:10">†</text>
      <text x="20" y="-10" style="font-size:10">†</text>
    </g>
  </g>

  <!-- Candles at base -->
  <g transform="translate(50, 190)">
    <rect x="-4" y="-50" width="8" height="50" fill="url(#robeRed)" stroke="#3d0000" stroke-width="1"/>
    <ellipse cx="0" cy="-55" rx="6" ry="3" fill="#dc143c" filter="url(#bloodGlow)">
      <animate attributeName="ry" values="3;2;3" dur="1.5s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <g transform="translate(240, 190)">
    <rect x="-4" y="-50" width="8" height="50" fill="url(#robeRed)" stroke="#3d0000" stroke-width="1"/>
    <ellipse cx="0" cy="-55" rx="6" ry="3" fill="#dc143c" filter="url(#bloodGlow)">
      <animate attributeName="ry" values="3;2;3" dur="1.5s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <rect x="2" y="2" width="286" height="216" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.4" rx="4"/>
</svg>