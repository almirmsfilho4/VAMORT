<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 220" width="290" height="220">
  <defs>
    <linearGradient id="twilightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a2a5a"/>
      <stop offset="30%" style="stop-color:#2a1a3a"/>
      <stop offset="60%" style="stop-color:#1a0a2a"/>
      <stop offset="100%" style="stop-color:#0d0515"/>
    </linearGradient>
    <linearGradient id="twilightScales" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8a4a9a"/>
      <stop offset="50%" style="stop-color:#5a2a6a"/>
      <stop offset="100%" style="stop-color:#3a1a4a"/>
    </linearGradient>
    <linearGradient id="twilightWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="30%" style="stop-color:#ff8c00"/>
      <stop offset="60%" style="stop-color:#dc143c"/>
      <stop offset="100%" style="stop-color:#4a1a5a"/>
    </linearGradient>
    <linearGradient id="twilightBreath" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="50%" style="stop-color:#ff4444"/>
      <stop offset="100%" style="stop-color:#8a2a8a"/>
    </linearGradient>
    <radialGradient id="twilightCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#ff8c00;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#4a1a5a;stop-opacity:0"/>
    </radialGradient>
    <filter id="twilightGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feFlood flood-color="#ffd700" flood-opacity="0.6"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="290" height="220" fill="url(#twilightBg)"/>

  <!-- Twilight stars/particles -->
  <g fill="#ffd700" opacity="0.6">
    <circle cx="50" cy="40" r="1.5">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="30" r="1">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="180" r="1.5">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="190" r="1">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="145" cy="80" r="2">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Twilight Drake -->
  <g transform="translate(145, 130)">
    <!-- Body -->
    <path d="M -30,20 Q -40,-10 -35,-50 Q -20,-80 0,-90 Q 20,-80 35,-50 Q 40,-10 30,20 Q 20,40 -5,45 Q -20,40 -30,20" fill="url(#twilightScales)" stroke="#5a2a6a" stroke-width="1.5"/>

    <!-- Scales pattern -->
    <g fill="none" stroke="#6a3a7a" stroke-width="0.8" opacity="0.5">
      <path d="M -25,10 Q -20,0 -15,-5"/>
      <path d="M -10,5 Q -5,-5 0,-10"/>
      <path d="M 5,5 Q 10,-5 15,-10"/>
      <path d="M 20,10 Q 25,0 30,-5"/>
      <path d="M -25,30 Q -20,20 -15,15"/>
      <path d="M -10,25 Q -5,15 0,10"/>
      <path d="M 5,25 Q 10,15 15,10"/>
      <path d="M 20,30 Q 25,20 30,15"/>
    </g>

    <!-- Wings - large and gradient -->
    <!-- Left wing -->
    <path d="M -35,-10 Q -100,-60 -90,-120 Q -50,-100 -20,-40 Q -30,-20 -35,-10" fill="url(#twilightWing)" filter="url(#twilightGlow)" opacity="0.9">
      <animate attributeName="d" values="M -35,-10 Q -100,-60 -90,-120 Q -50,-100 -20,-40 Q -30,-20 -35,-10; M -35,-10 Q -105,-55 -95,-115 Q -55,-95 -20,-40 Q -30,-20 -35,-10; M -35,-10 Q -100,-60 -90,-120 Q -50,-100 -20,-40 Q -30,-20 -35,-10" dur="4s" repeatCount="indefinite"/>
    </path>
    <!-- Right wing -->
    <path d="M 35,-10 Q 100,-60 90,-120 Q 50,-100 20,-40 Q 30,-20 35,-10" fill="url(#twilightWing)" filter="url(#twilightGlow)" opacity="0.9">
      <animate attributeName="d" values="M 35,-10 Q 100,-60 90,-120 Q 50,-100 20,-40 Q 30,-20 35,-10; M 35,-10 Q 105,-55 95,-115 Q 55,-95 20,-40 Q 30,-20 35,-10; M 35,-10 Q 100,-60 90,-120 Q 50,-100 20,-40 Q 30,-20 35,-10" dur="4s" repeatCount="indefinite"/>
    </path>

    <!-- Wing membrane details -->
    <g stroke="#ffd700" stroke-width="1" fill="none" opacity="0.6" filter="url(#twilightGlow)">
      <path d="M -35,-10 Q -70,-50 -60,-90"/>
      <path d="M -35,-10 Q -80,-40 -70,-80"/>
      <path d="M -35,-10 Q -90,-30 -80,-70"/>
      <path d="M 35,-10 Q 70,-50 60,-90"/>
      <path d="M 35,-10 Q 80,-40 70,-80"/>
      <path d="M 35,-10 Q 90,-30 80,-70"/>
    </g>

    <!-- Neck and head -->
    <path d="M -10,-50 Q -15,-70 -10,-90 Q 0,-100 10,-90 Q 15,-70 10,-50" fill="url(#twilightScales)" stroke="#5a2a6a" stroke-width="1.5"/>
    <!-- Head -->
    <ellipse cx="0" cy="-100" rx="20" ry="18" fill="url(#twilightScales)" stroke="#5a2a6a" stroke-width="1.5"/>
    <!-- Snout -->
    <path d="M 10,-100 Q 25,-105 30,-95 Q 25,-85 10,-90" fill="url(#twilightScales)" stroke="#5a2a6a" stroke-width="1.5"/>
    <!-- Glowing eyes -->
    <ellipse cx="-5" cy="-102" rx="5" ry="6" fill="url(#twilightCore)" filter="url(#twilightGlow)">
      <animate attributeName="rx" values="5;3;5" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="5" cy="-102" rx="5" ry="6" fill="url(#twilightCore)" filter="url(#twilightGlow)">
      <animate attributeName="rx" values="5;3;5" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Horns -->
    <path d="M -12,-110 Q -15,-120 -10,-125 Q -5,-120 -8,-110" fill="url(#twilightWing)" filter="url(#twilightGlow)"/>
    <path d="M 12,-110 Q 15,-120 10,-125 Q 5,-120 8,-110" fill="url(#twilightWing)" filter="url(#twilightGlow)"/>

    <!-- Tail -->
    <path d="M 30,20 Q 60,10 70,-10 Q 65,-20 50,-15 Q 40,-10 30,20" fill="url(#twilightScales)" stroke="#5a2a6a" stroke-width="1.5"/>
    <!-- Tail tip -->
    <path d="M 70,-10 Q 80,-15 75,-25 Q 70,-20 65,-15" fill="url(#twilightWing)" filter="url(#twilightGlow)"/>

    <!-- Legs with claws -->
    <g fill="url(#twilightScales)" stroke="#5a2a6a" stroke-width="1.5">
      <!-- Front left -->
      <path d="M -15,20 L -15,50 Q -18,55 -15,60 L -12,60 Q -10,55 -12,50 L -12,20 Z"/>
      <path d="M -15,60 L -20,65 L -15,65 Z" fill="url(#twilightWing)"/>
      <path d="M -12,60 L -7,65 L -12,65 Z" fill="url(#twilightWing)"/>
      <!-- Front right -->
      <path d="M 15,20 L 15,50 Q 18,55 15,60 L 12,60 Q 10,55 12,50 L 12,20 Z"/>
      <path d="M 15,60 L 20,65 L 15,65 Z" fill="url(#twilightWing)"/>
      <path d="M 12,60 L 7,65 L 12,65 Z" fill="url(#twilightWing)"/>
      <!-- Rear left -->
      <path d="M -20,25 L -20,55 Q -23,60 -20,65 L -17,65 Q -15,60 -17,55 L -17,25 Z"/>
      <path d="M -20,65 L -25,70 L -20,70 Z" fill="url(#twilightWing)"/>
      <path d="M -17,65 L -12,70 L -17,70 Z" fill="url(#twilightWing)"/>
      <!-- Rear right -->
      <path d="M 20,25 L 20,55 Q 23,60 20,65 L 17,65 Q 15,60 17,55 L 17,25 Z"/>
      <path d="M 20,65 L 25,70 L 20,70 Z" fill="url(#twilightWing)"/>
      <path d="M 17,65 L 12,70 L 17,70 Z" fill="url(#twilightWing)"/>
    </g>

    <!-- Twilight breath effect -->
    <g transform="translate(0, -100)" filter="url(#twilightGlow)">
      <path d="M 15,-95 Q 30,-120 25,-140 Q 20,-130 15,-110" fill="url(#twilightBreath)" opacity="0.7">
        <animate attributeName="opacity" values="0.7;0.3;0.7" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="d" values="M 15,-95 Q 30,-120 25,-140 Q 20,-130 15,-110; M 15,-95 Q 35,-115 30,-145 Q 25,-135 15,-110; M 15,-95 Q 30,-120 25,-140 Q 20,-130 15,-110" dur="1.5s" repeatCount="indefinite"/>
      </path>
      <path d="M 10,-95 Q 20,-115 15,-135 Q 10,-125 5,-110" fill="url(#twilightBreath)" opacity="0.5">
        <animate attributeName="opacity" values="0.5;0.2;0.5" dur="1.8s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Magic cards orbiting (representing hand buff) -->
    <g filter="url(#twilightGlow)">
      <rect x="-80" y="-40" width="25" height="35" fill="#4a1a5a" stroke="#ffd700" stroke-width="1.5" transform="rotate(-20)">
        <animateTransform attributeName="transform" type="rotate" from="-20 0 0" to="340 0 0" dur="10s" repeatCount="indefinite"/>
      </rect>
      <rect x="55" y="-50" width="22" height="32" fill="#4a1a5a" stroke="#ff8c00" stroke-width="1.5" transform="rotate(15)">
        <animateTransform attributeName="transform" type="rotate" from="15 0 0" to="375 0 0" dur="12s" repeatCount="indefinite"/>
      </rect>
      <rect x="-10" y="40" width="20" height="30" fill="#4a1a5a" stroke="#dc143c" stroke-width="1.5" transform="rotate(5)">
        <animateTransform attributeName="transform" type="rotate" from="5 0 0" to="365 0 0" dur="8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <rect x="2" y="2" width="286" height="216" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.5" rx="4"/>
</svg>