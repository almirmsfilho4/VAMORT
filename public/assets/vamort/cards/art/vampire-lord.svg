<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 220" width="290" height="220">
  <defs>
    <linearGradient id="vampireArtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d0000"/>
      <stop offset="50%" style="stop-color:#1a0000"/>
      <stop offset="100%" style="stop-color:#0d0000"/>
    </linearGradient>
    <linearGradient id="bloodRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc143c"/>
      <stop offset="100%" style="stop-color:#8b0000"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#b8860b"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#8b0000;stop-opacity:0"/>
    </radialGradient>
    <filter id="bloodGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="batSilhouette" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 20,50 Q 10,40 5,50 Q 10,60 20,50 Q 30,45 40,50 Q 30,55 20,50" fill="#1a0000" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="290" height="220" fill="url(#vampireArtBg)"/>
  <rect width="290" height="220" fill="url(#moonGlow)"/>
  <rect width="290" height="220" fill="url(#batSilhouette)"/>
  
  <!-- Moon -->
  <circle cx="230" cy="40" r="35" fill="#1a0000" stroke="url(#goldAccent)" stroke-width="1.5" opacity="0.8"/>
  <circle cx="225" cy="35" r="28" fill="url(#goldAccent)" opacity="0.4"/>
  <circle cx="220" cy="30" r="18" fill="#fff8dc" opacity="0.6"/>
  
  <!-- Castle silhouette -->
  <path d="M 10,220 L 10,120 Q 10,100 25,90 L 25,60 Q 25,40 40,40 L 55,40 Q 55,20 70,20 L 85,20 Q 85,40 100,40 L 100,70 Q 115,60 115,90 Q 115,100 130,100 L 130,150 Q 130,170 115,180 L 115,220 Z" 
        fill="#0a0000" stroke="#2d0000" stroke-width="1"/>
  <path d="M 140,220 L 140,140 Q 140,120 155,110 L 155,80 Q 155,60 170,60 L 185,60 Q 185,40 200,40 L 215,40 Q 215,60 230,60 L 230,100 Q 245,90 245,120 L 245,220 Z" 
        fill="#0a0000" stroke="#2d0000" stroke-width="1"/>
  
  <!-- Vampire Lord silhouette -->
  <g transform="translate(145, 140)" filter="url(#bloodGlow)">
    <!-- Cape -->
    <path d="M -60,0 Q -80,-20 -70,-60 Q -50,-80 -20,-70 Q 0,-60 0,-20 Q 0,-60 20,-70 Q 50,-80 70,-60 Q 80,-20 60,0 Z" 
          fill="url(#bloodRed)" opacity="0.9"/>
    <path d="M -50,0 Q -65,-15 -55,-45 Q -30,-60 0,-50 Q 30,-60 55,-45 Q 65,-15 50,0 Z" 
          fill="#8b0000" opacity="0.7"/>
    <!-- Body -->
    <ellipse cx="0" cy="10" rx="25" ry="35" fill="#1a0000" stroke="url(#goldAccent)" stroke-width="1"/>
    <!-- Collar -->
    <path d="M -30,-10 Q -20,-30 0,-25 Q 20,-30 30,-10 Q 10,0 -10,0 Q -10,0 -30,-10" fill="url(#bloodRed)" stroke="#ffd700" stroke-width="1.5"/>
    <!-- Head -->
    <ellipse cx="0" cy="-35" rx="18" ry="22" fill="#2d0000" stroke="#3d0000" stroke-width="1"/>
    <!-- Hair -->
    <path d="M -18,-50 Q -25,-55 -20,-45 Q -15,-40 -10,-45 Q -5,-50 0,-45 Q 5,-50 10,-45 Q 15,-40 20,-45 Q 25,-55 18,-50" fill="#0a0000"/>
    <!-- Eyes glowing -->
    <ellipse cx="-6" cy="-38" rx="3" ry="4" fill="url(#bloodRed)" filter="url(#bloodGlow)"/>
    <ellipse cx="6" cy="-38" rx="3" ry="4" fill="url(#bloodRed)" filter="url(#bloodGlow)"/>
    <!-- Fangs -->
    <path d="M -4,-28 L -2,-33 L 0,-28" fill="#fff" opacity="0.9"/>
    <path d="M 2,-28 L 4,-33 L 6,-28" fill="#fff" opacity="0.9"/>
    <!-- Crown/Circlet -->
    <path d="M -15,-50 Q -10,-60 -5,-50 Q 0,-60 5,-50 Q 10,-60 15,-50" fill="url(#goldAccent)" stroke="#b8860b" stroke-width="1"/>
    <circle cx="-10" cy="-50" r="2" fill="#dc143c"/>
    <circle cx="0" cy="-55" r="2.5" fill="#dc143c"/>
    <circle cx="10" cy="-50" r="2" fill="#dc143c"/>
  </g>
  
  <!-- Bats flying -->
  <g fill="#1a0000" opacity="0.7">
    <g transform="translate(50, 60)">
      <path d="M 0,0 Q -8,-4 -12,-2 Q -8,0 -10,5 Q -5,3 0,0"/>
      <path d="M 0,0 Q 8,-4 12,-2 Q 8,0 10,5 Q 5,3 0,0"/>
    </g>
    <g transform="translate(220, 80)">
      <path d="M 0,0 Q -6,-3 -9,-1 Q -6,0 -7,4 Q -3,2 0,0"/>
      <path d="M 0,0 Q 6,-3 9,-1 Q 6,0 7,4 Q 3,2 0,0"/>
    </g>
    <g transform="translate(80, 30)">
      <path d="M 0,0 Q -5,-2 -7,0 Q -4,1 -5,3 Q -1,2 0,0"/>
      <path d="M 0,0 Q 5,-2 7,0 Q 4,1 5,3 Q 1,2 0,0"/>
    </g>
  </g>
  
  <!-- Blood mist at bottom -->
  <ellipse cx="145" cy="210" rx="120" ry="25" fill="url(#bloodRed)" opacity="0.15"/>
  
  <!-- Border frame -->
  <rect x="2" y="2" width="286" height="216" fill="none" stroke="url(#goldAccent)" stroke-width="2" opacity="0.5" rx="4"/>
</svg>