<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 220" width="290" height="220">
  <defs>
    <linearGradient id="spellVampireBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a0000"/>
      <stop offset="50%" style="stop-color:#2d0000"/>
      <stop offset="100%" style="stop-color:#1a0000"/>
    </linearGradient>
    <linearGradient id="bloodMagic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc143c"/>
      <stop offset="50%" style="stop-color:#ff0000"/>
      <stop offset="100%" style="stop-color:#8b0000"/>
    </linearGradient>
    <radialGradient id="ritualGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#dc143c;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#1a0000;stop-opacity:0"/>
    </radialGradient>
    <filter id="magicGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feFlood flood-color="#dc143c" flood-opacity="0.6"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="290" height="220" fill="url(#spellVampireBg)"/>
  <rect width="290" height="220" fill="url(#ritualGlow)"/>
  
  <!-- Ritual circle -->
  <g transform="translate(145, 110)" filter="url(#magicGlow)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="90" fill="none" stroke="url(#bloodMagic)" stroke-width="3" opacity="0.8"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="#ffd700" stroke-width="1" opacity="0.6" stroke-dasharray="8,4"/>
    <!-- Middle circle -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="url(#bloodMagic)" stroke-width="2" opacity="0.7"/>
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="35" fill="url(#bloodMagic)" opacity="0.6"/>
    <circle cx="0" cy="0" r="30" fill="#0a0000"/>
    
    <!-- Rune symbols -->
    <g stroke="url(#bloodMagic)" stroke-width="2" fill="none">
      <!-- Vertical line -->
      <line x1="0" y1="-25" x2="0" y2="25"/>
      <!-- Horizontal line -->
      <line x1="-25" y1="0" x2="25" y2="0"/>
      <!-- Diagonals -->
      <line x1="-18" y1="-18" x2="18" y2="18"/>
      <line x1="-18" y1="18" x2="18" y2="-18"/>
      <!-- Outer runes -->
      <g transform="rotate(0)">
        <path d="M 0,-50 L 0,-40 M -5,-45 L 5,-45"/>
      </g>
      <g transform="rotate(45)">
        <path d="M 0,-50 L 0,-40 M -5,-45 L 5,-45"/>
      </g>
      <g transform="rotate(90)">
        <path d="M 0,-50 L 0,-40 M -5,-45 L 5,-45"/>
      </g>
      <g transform="rotate(135)">
        <path d="M 0,-50 L 0,-40 M -5,-45 L 5,-45"/>
      </g>
      <g transform="rotate(180)">
        <path d="M 0,-50 L 0,-40 M -5,-45 L 5,-45"/>
      </g>
      <g transform="rotate(225)">
        <path d="M 0,-50 L 0,-40 M -5,-45 L 5,-45"/>
      </g>
      <g transform="rotate(270)">
        <path d="M 0,-50 L 0,-40 M -5,-45 L 5,-45"/>
      </g>
      <g transform="rotate(315)">
        <path d="M 0,-50 L 0,-40 M -5,-45 L 5,-45"/>
      </g>
    </g>
    
    <!-- Blood droplets orbiting -->
    <g fill="url(#bloodMagic)">
      <circle cx="55" cy="0" r="5">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="70" cy="0" r="4">
        <animateTransform attributeName="transform" type="rotate" from="45 0 0" to="405 0 0" dur="10s" repeatCount="indefinite"/>
      </circle>
      <circle cx="50" cy="0" r="3">
        <animateTransform attributeName="transform" type="rotate" from="90 0 0" to="450 0 0" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="65" cy="0" r="4">
        <animateTransform attributeName="transform" type="rotate" from="135 0 0" to="495 0 0" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="45" cy="0" r="3">
        <animateTransform attributeName="transform" type="rotate" from="180 0 0" to="540 0 0" dur="6s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  
  <!-- Candles at corners -->
  <g transform="translate(40, 40)">
    <rect x="-5" y="20" width="10" height="50" fill="#2d0000" stroke="#3d0000" stroke-width="1"/>
    <ellipse cx="0" cy="18" rx="7" ry="4" fill="#1a0000" stroke="#3d0000" stroke-width="1"/>
    <path d="M -1,18 Q 0,5 1,18" fill="url(#bloodMagic)" filter="url(#magicGlow)">
      <animate attributeName="d" values="M -1,18 Q 0,5 1,18; M -1,18 Q 0,8 1,18; M -1,18 Q 0,5 1,18" dur="0.5s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <g transform="translate(250, 40)">
    <rect x="-5" y="20" width="10" height="50" fill="#2d0000" stroke="#3d0000" stroke-width="1"/>
    <ellipse cx="0" cy="18" rx="7" ry="4" fill="#1a0000" stroke="#3d0000" stroke-width="1"/>
    <path d="M -1,18 Q 0,5 1,18" fill="url(#bloodMagic)" filter="url(#magicGlow)">
      <animate attributeName="d" values="M -1,18 Q 0,5 1,18; M -1,18 Q 0,8 1,18; M -1,18 Q 0,5 1,18" dur="0.5s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <g transform="translate(40, 180)">
    <rect x="-5" y="20" width="10" height="50" fill="#2d0000" stroke="#3d0000" stroke-width="1"/>
    <ellipse cx="0" cy="18" rx="7" ry="4" fill="#1a0000" stroke="#3d0000" stroke-width="1"/>
    <path d="M -1,18 Q 0,5 1,18" fill="url(#bloodMagic)" filter="url(#magicGlow)">
      <animate attributeName="d" values="M -1,18 Q 0,5 1,18; M -1,18 Q 0,8 1,18; M -1,18 Q 0,5 1,18" dur="0.5s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <g transform="translate(250, 180)">
    <rect x="-5" y="20" width="10" height="50" fill="#2d0000" stroke="#3d0000" stroke-width="1"/>
    <ellipse cx="0" cy="18" rx="7" ry="4" fill="#1a0000" stroke="#3d0000" stroke-width="1"/>
    <path d="M -1,18 Q 0,5 1,18" fill="url(#bloodMagic)" filter="url(#magicGlow)">
      <animate attributeName="d" values="M -1,18 Q 0,5 1,18; M -1,18 Q 0,8 1,18; M -1,18 Q 0,5 1,18" dur="0.5s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Blood mist rising -->
  <g fill="url(#bloodMagic)" opacity="0.3">
    <ellipse cx="145" cy="200" rx="80" ry="15">
      <animate attributeName="cy" values="200;180;200" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.4;0.2" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="145" cy="190" rx="60" ry="12" opacity="0.2">
      <animate attributeName="cy" values="190;165;190" dur="4s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  
  <rect x="2" y="2" width="286" height="216" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.5" rx="4"/>
</svg>