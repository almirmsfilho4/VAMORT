<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 510" width="340" height="510">
  <defs>
    <linearGradient id="humanFrameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff8dc;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f5e6c8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8d5b7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="humanGoldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#daa520;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="humanLightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fffacd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0e68c;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="humanCenterGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fffff0;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#faf0e6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5f5dc;stop-opacity:1" />
    </radialGradient>
    <filter id="humanInnerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="humanOuterGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#ffd700" flood-opacity="0.5"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="vellumTexture" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.5" fill="#d4c4a8" opacity="0.2"/>
      <circle cx="6" cy="6" r="0.5" fill="#d4c4a8" opacity="0.15"/>
    </pattern>
    <pattern id="holyTexture" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M 6,0 L 6,12 M 0,6 L 12,6" stroke="#ffd700" stroke-width="0.3" opacity="0.1"/>
    </pattern>
  </defs>
  
  <!-- Outer divine glow -->
  <rect x="5" y="5" width="330" height="500" rx="15" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.4" filter="url(#humanOuterGlow)"/>
  
  <!-- Main frame border - ornate templar style -->
  <path d="M 15,15 
           L 325,15 
           Q 335,15 335,25 
           L 335,485 
           Q 335,495 325,495 
           L 15,495 
           Q 5,495 5,485 
           L 5,25 
           Q 5,15 15,15 Z" 
        fill="url(#humanFrameGrad)" 
        stroke="url(#humanGoldGrad)" 
        stroke-width="3"
        filter="url(#humanInnerGlow)"/>
  
  <!-- Inner frame accent -->
  <path d="M 25,25 
           L 315,25 
           Q 320,25 320,30 
           L 320,480 
           Q 320,485 315,485 
           L 25,485 
           Q 20,485 20,480 
           L 20,30 
           Q 20,25 25,25 Z" 
        fill="none" 
        stroke="url(#humanGoldGrad)" 
        stroke-width="1.5"
        opacity="0.9"/>
  
  <!-- Top ornament - sun/cross -->
  <g transform="translate(170, 35)">
    <!-- Sun rays -->
    <g stroke="url(#humanGoldGrad)" stroke-width="2" opacity="0.8">
      <line x1="0" y1="-35" x2="0" y2="-25"/>
      <line x1="0" y1="25" x2="0" y2="15"/>
      <line x1="-35" y1="0" x2="-25" y2="0"/>
      <line x1="25" y1="0" x2="35" y2="0"/>
      <line x1="-25" y1="-25" x2="-18" y2="-18"/>
      <line x1="18" y1="-18" x2="25" y2="-25"/>
      <line x1="-25" y1="25" x2="-18" y2="18"/>
      <line x1="18" y1="18" x2="25" y2="25"/>
    </g>
    <!-- Central sun disk -->
    <circle cx="0" cy="0" r="18" fill="url(#humanLightGrad)" stroke="url(#humanGoldGrad)" stroke-width="2"/>
    <circle cx="0" cy="0" r="12" fill="#fffacd" opacity="0.9"/>
    <!-- Cross -->
    <rect x="-3" y="-18" width="6" height="36" fill="url(#humanGoldGrad)" rx="1"/>
    <rect x="-18" y="-3" width="36" height="6" fill="url(#humanGoldGrad)" rx="1"/>
  </g>
  
  <!-- Name plate area -->
  <rect x="40" y="55" width="260" height="42" rx="8" fill="url(#humanLightGrad)" stroke="url(#humanGoldGrad)" stroke-width="2" opacity="0.95"/>
  
  
  <!-- Blood cost orb (gold for humans) -->
  <circle cx="300" cy="76" r="20" fill="url(#humanLightGrad)" stroke="url(#humanGoldGrad)" stroke-width="2" filter="url(#humanInnerGlow)"/>
  <circle cx="300" cy="76" r="12" fill="#faf0e6"/>
  
  
  
  <!-- Art area frame -->
  <rect x="25" y="115" width="290" height="220" rx="4" fill="url(#humanCenterGrad)" stroke="url(#humanGoldGrad)" stroke-width="1.5" opacity="0.9"/>
  <rect x="25" y="115" width="290" height="220" rx="4" fill="url(#vellumTexture)" opacity="0.5"/>
  <rect x="25" y="115" width="290" height="220" rx="4" fill="url(#holyTexture)" opacity="0.3"/>
  <!-- Placeholder for art -->
  
  
  <!-- Type line -->
  <rect x="35" y="350" width="270" height="28" rx="4" fill="#f5f5dc" stroke="url(#humanGoldGrad)" stroke-width="1" opacity="0.9"/>
  
  
  <!-- Text box -->
  <rect x="25" y="390" width="290" height="85" rx="4" fill="url(#humanCenterGrad)" stroke="#d4c4a8" stroke-width="1.5" opacity="0.95"/>
  <rect x="25" y="390" width="290" height="85" rx="4" fill="url(#vellumTexture)" opacity="0.4"/>
  
  
  
  <!-- Bottom ornament - laurels -->
  <g transform="translate(170, 495)" fill="url(#humanGoldGrad)" stroke="#daa520" stroke-width="1">
    <path d="M -35,0 Q -40,-10 -30,-15 Q -20,-10 -15,0 Q -20,5 -30,0 Q -40,5 -35,0"/>
    <path d="M 35,0 Q 40,-10 30,-15 Q 20,-10 15,0 Q 20,5 30,0 Q 40,5 35,0"/>
    <circle cx="0" cy="0" r="6" fill="#fffacd" stroke="url(#humanGoldGrad)" stroke-width="1.5"/>
  </g>
  
  <!-- Attack/Health orbs -->
  <!-- Attack (sword) -->
  <circle cx="60" cy="495" r="22" fill="url(#humanLightGrad)" stroke="url(#humanGoldGrad)" stroke-width="2" filter="url(#humanInnerGlow)"/>
  
  
  <!-- Health (shield) -->
  <circle cx="280" cy="495" r="22" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" filter="url(#humanInnerGlow)"/>
  <circle cx="280" cy="495" r="14" fill="#c8e6c9"/>
  
  
</svg>