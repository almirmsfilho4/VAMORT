<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0808"/>
      <stop offset="50%" style="stop-color:#0a0a0c"/>
      <stop offset="100%" style="stop-color:#050505"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a227"/>
      <stop offset="50%" style="stop-color:#f0d8b8"/>
      <stop offset="100%" style="stop-color:#c9a227"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b0000"/>
      <stop offset="50%" style="stop-color:#dc143c"/>
      <stop offset="100%" style="stop-color:#8b0000"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="600" fill="url(#bgGrad)"/>
  
  <!-- Radial glows -->
  <ellipse cx="400" cy="200" rx="300" ry="200" fill="rgba(139,0,0,0.15)"/>
  <ellipse cx="1520" cy="400" rx="400" ry="250" fill="rgba(201,162,39,0.1)"/>
  
  <!-- Castle silhouettes -->
  <path d="M 0 450 L 100 350 L 150 450 L 200 380 L 250 450 L 350 320 L 400 450 L 500 380 L 550 450 L 650 340 L 700 450 L 800 360 L 850 450 L 950 330 L 1000 450 L 1100 370 L 1150 450 L 1250 350 L 1300 450 L 1400 340 L 1450 450 L 1550 360 L 1600 450 L 1700 330 L 1750 450 L 1850 350 L 1920 450 L 1920 600 L 0 600 Z" 
        fill="#0f0a0a" opacity="0.6"/>
  
  <!-- Left: Human Paladin -->
  <g transform="translate(400, 300)">
    <!-- Aura -->
    <ellipse cx="0" cy="-50" rx="120" ry="150" fill="rgba(240,216,184,0.2)" filter="url(#glow)"/>
    <!-- Body -->
    <path d="M -30 100 L -20 -50 L 20 -50 L 30 100 Z" fill="url(#goldGrad)" opacity="0.8"/>
    <!-- Head -->
    <circle cx="0" cy="-70" r="25" fill="url(#goldGrad)"/>
    <!-- Sword -->
    <path d="M 30 -30 L 80 -80 L 90 -70 L 40 -20 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
    <!-- Shield -->
    <ellipse cx="-40" cy="20" rx="25" ry="35" fill="url(#goldGrad)" opacity="0.9"/>
    <cross cx="-40" cy="20" width="30" height="40" stroke="#8b0000" stroke-width="3"/>
  </g>
  
  <!-- Right: Vampire Lord -->
  <g transform="translate(1520, 300)">
    <!-- Dark aura -->
    <ellipse cx="0" cy="-50" rx="140" ry="160" fill="rgba(220,20,60,0.25)" filter="url(#glow)"/>
    <!-- Cape -->
    <path d="M -50 -100 Q -80 0 -60 100 L 60 100 Q 80 0 50 -100 Z" fill="url(#redGrad)" opacity="0.9"/>
    <!-- Body -->
    <rect x="-25" y="-80" width="50" height="150" fill="#1a0a0a"/>
    <!-- Head -->
    <circle cx="0" cy="-95" r="22" fill="#2a1010"/>
    <!-- Bat wings -->
    <path d="M -30 -60 Q -100 -100 -120 -40 Q -80 0 -50 -30" fill="url(#redGrad)" opacity="0.7"/>
    <path d="M 30 -60 Q 100 -100 120 -40 Q 80 0 50 -30" fill="url(#redGrad)" opacity="0.7"/>
    <!-- Eyes -->
    <circle cx="-8" cy="-95" r="4" fill="#ff0000" filter="url(#glow)"/>
    <circle cx="8" cy="-95" r="4" fill="#ff0000" filter="url(#glow)"/>
  </g>
  
  <!-- Center clash effect -->
  <circle cx="960" cy="300" r="80" fill="rgba(201,162,39,0.3)" filter="url(#glow)"/>
  <circle cx="960" cy="300" r="50" fill="rgba(220,20,60,0.4)"/>
  
  <!-- VAMORT Logo -->
  <text x="960" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="72" font-weight="900" 
        fill="url(#goldGrad)" filter="url(#glow)" letter-spacing="8">VAMORT</text>
  <text x="960" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" 
        fill="#8a7a6a" letter-spacing="4">BATALHA DE CARTAS</text>
  
  <!-- Decorative border -->
  <rect x="20" y="20" width="1880" height="560" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.3"/>
  <rect x="25" y="25" width="1870" height="550" fill="none" stroke="#3a2a1a" stroke-width="1"/>
</svg>
